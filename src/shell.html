<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.500-3.300 8-8 9-4.700-1-8-4.500-8-9V6z"/><path d="M8.500 12l2.500 2.500 4.500-5"/></svg></div><div><b>Backup &amp; DR</b><small>Programme Manager</small></div></div>

    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn hamb" data-action="nav-toggle" aria-label="Open menu"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h2 id="pageTitle">Dashboard</h2>
      <span class="sp"></span>
      <span id="saveChip" class="save-chip" role="status" aria-live="polite">Ready</span>
      <button class="btn small tb-btn" data-action="import-json" title="Load a project from a JSON file (replaces current data after confirmation)"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></svg><span>Import JSON</span></button>
      <button class="btn small tb-btn" data-action="export-json" title="Download the full project as a JSON file"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>Export JSON</span></button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<dialog id="modal" aria-modal="true"></dialog>
<dialog id="confirm" aria-modal="true"></dialog>
<div id="toasts" aria-live="polite"></div>

<div id="printArea" aria-hidden="true"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
