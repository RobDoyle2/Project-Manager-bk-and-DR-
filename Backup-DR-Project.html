function viewTasks() {
  let h = pageHead('Tasks & Subtasks', 'Every task belongs to an objective. Tasks with subtasks calculate their progress automatically; others are updated by hand.', btn('New task', 'task-new', '', 'primary', 'plus') + btn('Add several / import CSV', 'tasks-bulk', '', '', 'plus'));
  if (!D.totals.tasks) return h + emptyState('No tasks yet', 'Add tasks one at a time, or paste a list of names / import a CSV to create many at once. Tasks do not need an objective — link them to one later.', btn('Add several tasks', 'tasks-bulk', '', 'primary', 'plus') + ' ' + btn('New task', 'task-new', '', '', 'plus') + ' ' + btn('Create objective', 'obj-new', '', '', 'plus'));
  const f = ui.taskFilter, q = f.q.toLowerCase();
  const owners = ownerList();
  h += `<div class="toolbar wrap"><input type="search" id="taskQ" class="search" placeholder="Search tasks, owners, IDs…" value="${esc(f.q)}" data-f="taskFilter.q" aria-label="Search tasks">
    <select data-f="taskFilter.obj" aria-label="Objective"><option value="all">All objectives</option>${data.objectives.map(o => `<option value="${esc(o.id)}" ${f.obj === o.id ? 'selected' : ''}>${o.system ? 'Unassigned tasks' : esc(o.name)}</option>`).join('')}</select>
    <select data-f="taskFilter.status" aria-label="Status"><option value="all">All statuses</option>${STATUS_ORDER.map(s => `<option value="${s}" ${f.status === s ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}</select>
    <select data-f="taskFilter.owner" aria-label="Owner"><option value="all">All owners</option>${owners.map(o => `<option ${f.owner === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>
    <label class="chk"><input type="checkbox" data-f="taskFilter.blockedOnly" ${f.blockedOnly ? 'checked' : ''}> Blocked only</label>
    <label class="chk"><input type="checkbox" data-f="taskFilter.hideDone" ${f.hideDone ? 'checked' : ''}> Hide completed</label></div>`;
  const text = x => (x.name + ' ' + x.owner + ' ' + x.id + ' ' + x.description).toLowerCase();
  const passes = (item) => {
    const i = D.node.get(item.id);
    if (f.status !== 'all' && i.status !== f.status) return false;
    if (f.owner !== 'all' && item.owner !== f.owner) return false;
    if (f.blockedOnly && !i.blocked) return false;
    if (f.hideDone && i.done) return false;
    return !q || text(item).includes(q);
  };
  let rows = '', shownT = 0, shownS = 0;
  const filtering = q || f.status !== 'all' || f.owner !== 'all' || f.blockedOnly || f.hideDone;
  data.objectives.forEach(o => {
    if (f.obj !== 'all' && f.obj !== o.id) return;
    const oi = D.obj.get(o.id);
    let body = '';
    o.tasks.forEach(t => {
      const subsPass = t.subtasks.filter(passes);
      const tPass = passes(t);
      if (filtering && !tPass && !subsPass.length) return;
      shownT++;
      body += taskRowHtml('task', t);
      const showSubs = filtering ? (tPass ? t.subtasks.filter(s => !(f.hideDone && D.node.get(s.id).done)) : subsPass) : t.subtasks;
      if (!ui.collapsed.has(t.id) || filtering) showSubs.forEach(s => { shownS++; body += taskRowHtml('sub', s); });
    });
    if (filtering && !body) return;
    const hdr = o.system
      ? `<div class="t-group-h st-not-started"><div class="tg-l"><span class="tg-bar"></span><div><h3>Unassigned tasks</h3><small><span class="muted">Not linked to an objective yet — open a task and choose an objective when you are ready.</span></small></div></div><div class="tg-r">${btn('Task', 'task-new', 'data-obj="unassigned"', 'small', 'plus')}</div></div>`
      : `<div class="t-group-h st-${oi.status}" style="--c:${objCol(o).c};--cs:${objCol(o).l}"><div class="tg-l"><span class="tg-bar"></span><div><h3>${esc(o.name)}</h3><small>${idChip(o.id)} ${pill(oi.status)} <span class="muted">${esc(rangeText(o.startDate, o.endDate))}${o.owner ? ' · ' + esc(o.owner) : ''}</span></small></div></div>
      <div class="tg-r"><div class="tg-prog">${pbarC(oi.progress, objCol(o).c)}<b>${pct(oi.progress)}%</b></div>${btn('Task', 'task-new', `data-obj="${esc(o.id)}"`, 'small', 'plus')}</div></div>`;
    rows += `<section class="t-group">${hdr}
      <div class="t-head"><div>Task / subtask</div><div>Owner</div><div>Dates</div><div>Priority</div><div>Status</div><div>Progress</div><div></div></div>
      ${body || '<p class="muted pad">No tasks yet. Use “Task” to add one.</p>'}</section>`;
  });
  h += rows || '<p class="muted">No tasks match the filters.</p>';
  h += `<p class="muted small foot">Showing ${shownT} task${shownT === 1 ? '' : 's'} and ${shownS} subtask${shownS === 1 ? '' : 's'}. Drag a slider to update progress — parent task and objective progress, status, dashboard and roadmap update instantly.</p>`;
  return h;
}

  }

}

function depMatrixHtml() {
  const deps = data.dependencies;
  const rows = Array.from(new Set(deps.map(d => d.fromId)));
  const colMap = new Map();
  deps.forEach(d => { const key = d.toId || `${d.type}:${d.assetName}`; if (!colMap.has(key)) colMap.set(key, { key, label: d.toId ? nameOf(d.toId) : d.assetName, kind: d.toId ? kindLabel(d.toId) : (d.type === 'recovery' ? 'Recovery' : 'Asset') }); });
  const cols = Array.from(colMap.values()).sort((a, b) => a.kind.localeCompare(b.kind) || a.label.localeCompare(b.label));
  const cell = (r, c) => {
    const m = deps.filter(d => d.fromId === r && (d.toId || `${d.type}:${d.assetName}`) === c.key);
    if (!m.length) return '<td></td>';
    const d = m[0];
    return `<td class="mx-on"><button class="mx-dot ds-${d.status} ${D.conflicts.has(d.id) ? 'conf' : ''}" data-action="dep-edit" data-id="${esc(d.id)}" data-tip="${esc(`${nameOf(r)} → ${c.label}\n${DEP_TYPES[d.type]} · ${cap(d.status)}${d.note ? '\n' + d.note : ''}`)}" aria-label="Dependency ${esc(d.id)}"></button></td>`;
  };
  return `<div class="matrix-wrap"><table class="matrix"><thead><tr><th class="corner">Depends on →<br><small>Dependent ↓</small></th>${cols.map(c => `<th class="col"><span><small>${c.kind}</small> ${esc(c.label)}</span></th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr><th class="row"><small>${kindLabel(r)}</small> ${esc(nameOf(r))}</th>${cols.map(c => cell(r, c)).join('')}</tr>`).join('')}</tbody></table>
    <div class="legend mt"><span class="lg"><i class="dot ds-open"></i>Open</span><span class="lg"><i class="dot ds-at-risk"></i>At risk</span><span class="lg"><i class="dot ds-satisfied"></i>Satisfied</span><span class="lg"><i class="dot conf-d"></i>Schedule conflict (ring)</span></div></div>`;
}

/* =====================================================================
   Roadmap — generated directly from `data` + derived values on every
   render. There is no separate roadmap dataset.
   ===================================================================== */
function roadmapRange() {
  let s = dayNum(data.project.startDate), e = dayNum(data.project.endDate), extended = false;
  if (s === null || e === null || e < s) { s = dayNum('2026-10-01'); e = dayNum('2027-06-30'); }
  const eat = (a, b) => {
    const x = dayNum(a), y = dayNum(b || a);
    if (x !== null && x < s) { s = x; extended = true; }
    if (y !== null && y > e) { e = y; extended = true; }
  };
  data.objectives.forEach(o => {
    if (!o.system) { eat(o.startDate, o.endDate); eat(o.forecastStart || o.startDate, o.forecastEnd || o.endDate); }
    o.tasks.forEach(t => {
      eat(t.startDate, t.endDate); eat(t.forecastStart || t.startDate, t.forecastEnd || t.endDate);
      t.subtasks.forEach(x => { eat(x.startDate, x.endDate); eat(x.forecastStart || x.startDate, x.forecastEnd || x.endDate); });
    });
  });
  data.milestones.forEach(m => eat(m.date));
  const sd = new Date(s * DAY), ed = new Date(e * DAY);
  let y = sd.getUTCFullYear(), m = sd.getUTCMonth();
  const ey = ed.getUTCFullYear(), em = ed.getUTCMonth(), months = [];
  while ((y < ey || (y === ey && m <= em)) && months.length < 72) {
    const st = Date.UTC(y, m, 1) / DAY, nx = Date.UTC(y, m + 1, 1) / DAY;
    months.push({ y, mo: m + 1, start: st, days: nx - st });
    m++; if (m > 11) { m = 0; y++; }
  }
  const last = months[months.length - 1];
  const start = months[0].start, end = last.start + last.days - 1;
  return { start, end, total: end - start + 1, months, extended };
}
function mkPos(R) {
  return (a, b) => {
    const x = dayNum(a), y = dayNum(b);
    return { l: (x - R.start) / R.total * 100, w: Math.max((y - x + 1) / R.total * 100, 0.45) };
  };
}
function ganttHead(R, labelInner) {
  return `<div class="g-head"><div class="g-lab g-lab-head">${labelInner}</div><div class="g-months">${R.months.map(m => `<div class="g-month" style="flex:${m.days} 1 0"><b>${MONTHS[m.mo - 1]}</b><small>${m.y}</small></div>`).join('')}</div></div>`;
}
function ganttGrid(R) {
  const T = D.T;
  const today = (T >= R.start && T <= R.end) ? `<div class="g-today" style="left:${((T - R.start + 0.5) / R.total * 100).toFixed(3)}%"><span>Today</span></div>` : '';
  // Christmas break: 24 Dec – 2 Jan inclusive, every year the timeline covers
  const sy = new Date(R.start * DAY).getUTCFullYear(), ey = new Date(R.end * DAY).getUTCFullYear();
  let xmas = '';
  for (let y = sy - 1; y <= ey; y++) {
    const a = dayNum(`${y}-12-24`), b = dayNum(`${y + 1}-01-02`);
    const s = Math.max(a, R.start), e = Math.min(b, R.end);
    if (s > e) continue;
    xmas += `<div class="g-xmas" style="left:${((s - R.start) / R.total * 100).toFixed(3)}%;width:${((e - s + 1) / R.total * 100).toFixed(3)}%" data-xmas="${y}-12-24..${y + 1}-01-02"><span>Christmas break</span></div>`;
  }
  return `<div class="g-grid">${xmas}${R.months.map(m => `<div class="g-gl" style="flex:${m.days} 1 0"></div>`).join('')}<div class="g-today-wrap">${today}</div></div>`;
}
function itemTip(it, info, extra = '') {
  const lines = [`${it.name}  (${it.id})`];
  if (it.owner) lines.push('Owner: ' + it.owner);
  lines.push(`Baseline: ${rangeText(it.startDate, it.endDate)}`);
  if (it.forecastStart || it.forecastEnd) lines.push(`Forecast: ${rangeText(it.forecastStart || it.startDate, it.forecastEnd || it.endDate)}`);
  lines.push(`Progress: ${pct(info.progress)}%   Status: ${STATUS_LABEL[info.status]}`);
  if (info.ownBlocked && it.blocker) lines.push('Blocker: ' + it.blocker);

  if (deps.length) lines.push('Depends on: ' + deps.map(depTargetName).join('; '));
  if (extra) lines.push(extra);
  return lines.join('\n');
}
function barHtml(o) {

const MS_GLYPH = { planned: '', 'at-risk': '!', achieved: '✓', missed: '✕' };
function milestoneMarkers(R, P, opts) {
  const list = data.milestones.slice().sort((a, b) => dayNum(a.date) - dayNum(b.date));
  const levelEnd = [];
  const trackPx = opts.compact ? 640 : 900;
  let maxLevel = 0;
  const pts = list.map(m => {
    const l = (dayNum(m.date) - R.start + 0.5) / R.total * 100;
    const nm = m.name.length > 26 ? m.name.slice(0, 25) + '…' : m.name;
    const wPct = (nm.length * 6.4 + 26) / trackPx * 100;
    const left = l > 82 ? l - wPct + 1.2 : l - 0.8;
    let lv = 0; while (levelEnd[lv] !== undefined && levelEnd[lv] > left - 0.4) lv++;
    levelEnd[lv] = left + wPct; maxLevel = Math.max(maxLevel, lv);
    return { m, l, nm, lv, right: l > 82 };

  const html = pts.map(p => {

    return `<div class="ms-pt ms-${e}" style="left:${p.l.toFixed(3)}%;--mc:${msColour(p.m)}" data-tip="${esc(`${p.m.name}\n${fmtDate(p.m.date)} · ${MS_LABEL[e]}${p.m.objectiveId ? '\nObjective: ' + nameOf(p.m.objectiveId) : ''}${p.m.description ? '\n' + p.m.description : ''}`)}" data-action="ms-edit" data-id="${esc(p.m.id)}" role="button" tabindex="0">

  }).join('');
  return { html, height: 28 + (maxLevel + 1) * 15 + 6, count: list.length };
}

/* ---------------- Technical view: objectives › tasks › subtasks ---------------- */
function techRoadmapHtml(opts = {}) {

  let curObj = null;

    const col = objCol(curObj), i = D.node.get(it.id), pos = P(it.startDate, it.endDate), collapsed = ui.collapsed.has(it.id);
    const deps = D.depsFrom.get(it.id) || [];
    const chips = [];
    if (i.ownBlocked) chips.push(`<span class="chip red" data-tip="${esc(it.blocker || 'Blocked')}">${icon('ban', 11)} Blocked</span>`);
    else if (i.blocked) chips.push(`<span class="chip red">${icon('ban', 11)} Blocked below</span>`);

    if (deps.length) chips.push(`<span class="chip" data-tip="${esc(deps.map(d => '• ' + depTargetName(d)).join('\n'))}">${icon('link', 11)} ${deps.length}</span>`);
    const owner = it.owner ? esc(it.owner) : '<span class="muted">—</span>';
    const barTop = lvl === 0 ? 9 : 11, barH = lvl === 0 ? 24 : 20;
    const cls = `st-${i.status}${i.ownBlocked ? ' is-blocked' : ''}${i.overdue ? ' is-late' : ''}`;
    const oc = byStatus ? null : { kind: lvl === 0 ? 'o' : 't', c: col.c, l: col.l };
    const labAttr = byStatus ? '' : ` style="box-shadow:inset ${lvl === 0 ? 6 : 5}px 0 0 ${col.c}"`;
    return `<div class="g-row t-r lvl-${lvl}" style="height:48px"><div class="g-lab tl"${labAttr}>
        <div class="tl-name" style="padding-left:${6 + lvl * 20}px">${hasKids ? `<button class="chev ${collapsed ? '' : 'open'}" data-action="rm-toggle" data-id="${esc(it.id)}" aria-label="${collapsed ? 'Expand' : 'Collapse'}">${icon('chevron', 14)}</button>` : '<span class="chev-sp"></span>'}
          <div class="tl-txt"><b class="rm-name" role="button" tabindex="0" data-action="open-item" data-id="${esc(it.id)}" title="${esc(it.name)} — click to open (read only)">${esc(it.name)}</b><small>${esc(rangeText(it.startDate, it.endDate))}${chips.join('')}</small></div></div>
        <div class="tl-owner" title="${esc(it.owner || '')}">${owner}</div><div class="tl-pct">${pct(i.progress)}%</div><div class="tl-stat">${pill(i.status)}</div></div>
      <div class="g-track">${barHtml({ pos, progress: i.progress, cls, oc, tip: itemTip(it, i), id: it.id, chip: `${i.ownBlocked ? '⛔ ' : ''}${pct(i.progress)}%`, top: barTop, h: barH, label: it.name, note: i.ownBlocked ? (it.blocker || 'Blocked') : '' })}${fbarHtml(it, P, barTop + barH + 3, 5)}</div></div>`;
  };
  data.objectives.forEach(o => {
    if (ui.rmObj !== 'all' && ui.rmObj !== o.id) return;

      if (!o.tasks.length) return;
      const col = ui.collapsed.has(o.id);
      body += `<div class="g-row t-r lvl-0" style="height:40px"><div class="g-lab tl"><div class="tl-name" style="padding-left:6px"><button class="chev ${col ? '' : 'open'}" data-action="rm-toggle" data-id="${esc(o.id)}" aria-label="Toggle">${icon('chevron', 14)}</button><div class="tl-txt"><b>Unassigned tasks</b><small>Not linked to an objective yet</small></div></div></div><div class="g-track"></div></div>`;
      if (col) return;
    } else { curObj = o; body += row(o, 0, 'obj', o.tasks.length > 0); }

    o.tasks.forEach(t => {
      body += row(t, 1, 'task', t.subtasks.length > 0);

  let msOverlay = '';
  if (ui.rmMilestones && data.milestones.length) {
    msOverlay = `<div class="g-ms-line">${data.milestones.map(m => { const e = msEffective(m), l = (dayNum(m.date) - R.start + 0.5) / R.total * 100; return `<i class="ms-vline ms-${e}" style="left:${l.toFixed(3)}%;--mc:${msColour(m)}" data-tip="${esc('◆ ' + m.name + '\n' + fmtDate(m.date))}"></i>`; }).join('')}</div>`;
  }
  const note = R.extended ? `<p class="rm-note">The timeline was widened automatically because some items fall outside the project timeline.</p>` : '';
  const html = `<div class="gantt gantt-tech" style="--labelw:${labelW}px"><div class="gantt-scroll"><div class="gantt-inner">${ganttHead(R, head)}<div class="g-body">${ganttGrid(R)}${msOverlay}${body}</div></div></div></div>`;
  return html + (opts.print ? '' : note);
}

function updateSaveChip() {
  const el = $('#saveChip'); if (!el) return;

/* ---------------- import / export / reset ---------------- */
function readFileText(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(r.error || new Error('Could not read the file.')); r.readAsText(file); });
}
function problemList(items, cls) { return `<ul class="issues ${cls}">${items.slice(0, 25).map(x => `<li>${esc(x)}</li>`).join('')}${items.length > 25 ? `<li>…and ${items.length - 25} more</li>` : ''}</ul>`; }
async function handleImportFile(file) {
  let text;
  try { text = await readFileText(file); } catch (e) { toast('Could not read that file.', 'error'); return; }
  return handleImportText(text, file.name);
}
async function handleImportText(text, fileName) {
  const file = { name: fileName };
  let raw;
  try { raw = JSON.parse(text.replace(/^﻿/, '')); }
  catch (e) { await infoDialog({ title: 'Import failed', html: `<p><b>${esc(file.name)}</b> is not valid JSON.</p>${problemList([String(e.message)], 'err')}<p class="muted">Your current project data has not been changed.</p>` }); return; }
  const r = parseProject(raw);
  if (r.errors.length) {
    await infoDialog({ title: 'Import failed — file did not pass validation', html: `<p><b>${esc(file.name)}</b> has ${r.errors.length} problem${r.errors.length === 1 ? '' : 's'}:</p>${problemList(r.errors, 'err')}${r.warnings.length ? `<p>Also:</p>${problemList(r.warnings, 'warn')}` : ''}<p class="muted">Your current project data has not been changed.</p>` });
    return;
  }
  const cur = countsOf(data), inc = countsOf(r.data);
  const fmt = c => `${c.objectives} objectives, ${c.tasks} tasks, ${c.subtasks} subtasks, ${c.milestones} milestones, ${c.risks} risks`;
  const ok = await confirmDialog({
    title: 'Replace current project data?', danger: true, okLabel: 'Replace with imported data',
    message: `Importing <b>${esc(file.name)}</b> will <b>replace</b> everything currently in the application.`,
    html: `<div class="cmp"><div><small>Current</small><b>${esc(progName())}</b><span>${fmt(cur)}</span></div><div class="cmp-arrow">→</div><div><small>Imported</small><b>${esc(r.data.project.name || 'Programme name')}</b><span>${fmt(inc)}</span></div></div>
      ${r.warnings.length ? `<p>The file was accepted with ${r.warnings.length} note${r.warnings.length === 1 ? '' : 's'}:</p>${problemList(r.warnings, 'warn')}` : ''}
      <p class="muted small">A backup of your current data is saved in this browser first (Reports &amp; Data Management → Browser backups).</p>`
  });
  if (!ok) { toast('Import cancelled — nothing was changed.', 'warn'); return; }
  snapshot(`Before import of ${file.name}`);
  data = r.data; ui.collapsed.clear(); ui.objOpen.clear();
  ui.taskFilter = { q: '', obj: 'all', status: 'all', owner: 'all', blockedOnly: false, hideDone: false }; ui.objFilter = { q: '', status: 'all' }; ui.rmObj = 'all';
  syncStored(); D = derive(); saveLocal(); go('dashboard'); render();
  toast(`Imported ${inc.objectives} objectives and ${inc.tasks} tasks.`);
  return true;
}
async function resetProject() {
  const ok = await confirmDialog({ title: 'Reset project?', danger: true, okLabel: 'Delete everything and start blank', message: 'This removes <b>all</b> objectives, tasks, subtasks, risks, dependencies and milestones from the application. A backup is saved in this browser first, but you should export a JSON copy if you may need this data again.' });
  if (!ok) return;
  snapshot('Before reset'); data = blankProject(); ui.collapsed.clear(); ui.objOpen.clear(); afterChange(); toast('Project reset to a blank state.');
}
async function restoreBackup(i) {
  const b = readBackups()[i]; if (!b) return;
  let r; try { r = parseProject(JSON.parse(b.json)); } catch (e) { r = { errors: ['Backup is unreadable.'] }; }
  if (r.errors.length) { toast('That backup could not be read.', 'error'); return; }
  const ok = await confirmDialog({ title: 'Restore this backup?', danger: true, okLabel: 'Restore backup', message: `Replace the current project data with the backup from <b>${esc(fmtDateTime(b.at))}</b> (${esc(b.reason)})? The current data is backed up first.` });
  if (!ok) return;
  snapshot('Before restore'); data = r.data; ui.collapsed.clear(); afterChange(); toast('Backup restored.');
}

  toggle: ds => { ui.collapsed.has(ds.id) ? ui.collapsed.delete(ds.id) : ui.collapsed.add(ds.id); render(); },
  'rm-toggle': ds => { ui.collapsed.has(ds.id) ? ui.collapsed.delete(ds.id) : ui.collapsed.add(ds.id); render(); },
  'rm-expand': () => { ui.collapsed.clear(); render(); },
  'rm-collapse': () => { data.objectives.forEach(o => ui.collapsed.add(o.id)); render(); },
  'rm-mode': ds => { ui.rmMode = ds.mode; saveUiPrefs(); render(); },
  'risk-new': () => riskModal(), 'risk-edit': ds => riskModal(ds.id), 'risk-del': ds => deleteRiskFlow(ds.id),
  'blocker-flag': () => blockerModal(), 'blocker-resolve': ds => resolveBlocker(ds.id),
  'dep-new': () => { if (!D.totals.tasks && !D.totals.objectives) { toast('Create an objective or task first.', 'warn'); return; } depModal(); },
  'dep-edit': ds => depModal(ds.id), 'dep-del': ds => deleteDepFlow(ds.id),
  'ms-new': () => milestoneModal(), 'ms-edit': ds => milestoneModal(ds.id), 'ms-del': ds => deleteMilestoneFlow(ds.id),
  tab: ds => { ui[ds.group] = ds.tab; render(); },
  'set-prog': (ds, el) => {
    const f = el.closest('form'), pr = f && f.elements.progress; if (!pr) return;
    pr.value = ds.v; pr.dispatchEvent(new Event('input', { bubbles: true }));
  },
  'dep-row-add': (ds, el) => {
    const ed = el.closest('[data-depeditor]'); const list = $('.dep-list', ed);
    list.insertAdjacentHTML('beforeend', depRowHtml({ type: 'task' }, ed.dataset.self));
  },
  'link-row-add': (ds, el) => { const ed = el.closest('[data-linkeditor]'); $('.link-list', ed).insertAdjacentHTML('beforeend', linkRowHtml()); const n = $$('.link-row', ed).pop(); if (n) $('[name=lName]', n).focus(); },
  'link-row-del': (ds, el) => { const r = el.closest('.link-row'); if (r) r.remove(); },
  'copy-link': ds => {
    const t = ds.url, ok = () => toast('Copied — paste it into File Explorer or your browser.');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, () => toast(t, 'warn', 9000)); else toast(t, 'warn', 9000);
  },
  'dep-row-del': (ds, el) => { const r = el.closest('.dep-row'); if (r) r.remove(); },
  'export-json': () => { if (FSA.save) exportToChosenFile(); else downloadExport(); },
  'share-json': async () => {
    const r = await shareJSON(); render();
    if (r === 'shared') toast('Shared — choose Files, Drive or another app to keep it.');
    else if (r === 'failed') toast('Sharing isn\'t available here. Use “Show / copy JSON” instead.', 'warn', 7000);
  },
  'download-backup': ds => { const b = readBackups()[+ds.i]; if (b) download(stampName(fileBase() + '-backup', 'json'), JSON.stringify(JSON.parse(b.json), null, 2)); },
  'save-now': () => { const a = saveLocal(), b = snapshot('Manual save'); toast(a ? (b ? 'Saved and backed up in this browser.' : 'Saved (backup could not be stored).') : 'Browser storage unavailable — please use Export JSON.', a ? 'ok' : 'error'); render(); },
  'show-json': () => {
    computedFields();
    const json = JSON.stringify(data, null, 2);
    openModal({ title: 'Project JSON', wide: true, hideSave: true, cancelLabel: 'Close',
      html: `<p class="muted small">Use this when downloads are blocked (for example in an embedded viewer): copy the text, then paste it into a text file saved as <b>.json</b>, or into “Paste JSON…” on another copy of the app.</p>
        <textarea id="jsonOut" class="json-box" readonly rows="14">${esc(json)}</textarea>
        <div class="btn-row mt">${btn('Copy to clipboard', 'copy-json', '', 'primary')}<span class="muted small">${json.length.toLocaleString()} characters</span></div>` });
    setTimeout(() => { const t = $('#jsonOut'); if (t) t.select(); }, 50);
  },
  'copy-json': () => {
    const t = $('#jsonOut'); if (!t) return; t.select();
    const done = () => toast('JSON copied to the clipboard.');
    const fallback = () => { try { document.execCommand('copy') ? done() : toast('Press Ctrl+C to copy the selected text.', 'warn'); } catch (e) { toast('Press Ctrl+C to copy the selected text.', 'warn'); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done, fallback); else fallback();
  },
  'paste-json': () => {
    openModal({ title: 'Paste JSON to import', wide: true, saveLabel: 'Check & import',
      html: `<p class="muted small">Paste the full text of a project JSON file here. It is validated first, and you will be asked to confirm before your current data is replaced.</p>
        <textarea name="jsonIn" class="json-box" rows="14" placeholder='{ "schemaVersion": 1, ... }'></textarea>`,
      onSave: f => {
        const text = f.elements.jsonIn.value.trim();
        if (!text) return { error: 'Paste the JSON text first.', field: 'jsonIn' };
        setTimeout(() => handleImportText(text, 'pasted JSON'), 0);
      } });
  },
  'restore-backup': ds => restoreBackup(+ds.i),
  'delete-backup': ds => { const l = readBackups(); l.splice(+ds.i, 1); try { localStorage.setItem(LS_BACKUPS, JSON.stringify(l)); } catch (e) { /* ignore */ } render(); },
  'reset-project': () => resetProject(),
  'download-template': () => { download('Project-blank.json', JSON.stringify(blankProject(), null, 2)); },
  'print-roadmap': ds => doPrint('roadmap', ds.mode || ui.rmMode),
  'print-report': () => doPrint('report'),
  'download-report': () => { downloadReport(); toast('Status report downloaded.'); },
  'brand-edit': () => openModal({
    title: 'Programme name', saveLabel: 'Save',
    html: fld('Name', inp('pname', data.project.name || '', 'maxlength="120" placeholder="Programme name" autocomplete="off"'), 'full', 'Shown top left and stored in the project file. Press the status button in the top bar to write it to your file.'),
    onSave: f => { const v = f.elements.pname.value.trim(); if (v !== (data.project.name || '')) { data.project.name = v; afterChange(); toast(v ? 'Programme name saved.' : 'Programme name cleared.'); } },
    onOpen: f => { const i = f.elements.pname; i.focus(); i.select(); }
  }),
  'nav-toggle': () => { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); }
};
const SUBMITS = {
  'save-settings': f => {
    const name = f.elements.pname.value.trim(), s = f.elements.pstart.value, e = f.elements.pend.value, err = $('#settingsErr');
    const bad = (!parseISO(s) || !parseISO(e)) ? 'Enter valid timeline start and end dates.' : dayNum(e) < dayNum(s) ? 'Timeline end must be after the start.' : '';
    if (bad) { err.textContent = bad; err.hidden = false; return; }
    Object.assign(data.project, { name, description: f.elements.pdesc.value.trim(), manager: f.elements.pmanager.value.trim(), startDate: s, endDate: e });
    afterChange(); toast('Project settings saved.');
  }
};
document.addEventListener('click', e => {
  const navA = e.target.closest('#nav a[data-nav]');
  if (navA) { e.preventDefault(); $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); go(navA.dataset.nav); return; }
  const el = e.target.closest('[data-action]');
  if (!el) {
    if (e.target.id === 'scrim') ACTIONS['nav-toggle']();
    return;
  }
  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); try { fn(el.dataset, el, e); } catch (err) { console.error(err); toast('Something went wrong: ' + (err && err.message ? err.message : err), 'error', 8000); } }
  if (el.dataset.nav !== undefined || el.closest('#sidebar')) { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.bar[data-action],.ms-pt[data-action],.rm-name[data-action]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-submit]');
  if (f) { e.preventDefault(); SUBMITS[f.dataset.submit](f); }
});
function setFilter(el) {
  const path = el.dataset.f.split('.');
  const v = el.type === 'checkbox' ? el.checked : el.value;
  if (path.length === 1) ui[path[0]] = v; else ui[path[0]][path[1]] = v;
  if (['rmMode', 'rmColor', 'rmMgmtColor', 'rmMilestones', 'rmForecast'].includes(path[0])) saveUiPrefs();
  render();
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.f && el.type === 'search') setFilter(el);
  else if (el.matches && el.matches('[data-progress]')) { const t = el.parentElement.querySelector('.ptxt'); if (t) t.textContent = el.value + '%'; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.f && el.type !== 'search') setFilter(el);
  else if (el.matches && el.matches('[data-progress]')) {
    const n = D.node.get(el.dataset.id);
    if (n) { setLeafProgress(n.item, el.value); afterChange(); }
  } else if (el.id === 'fileInput' && el.files && el.files[0]) handleImportFile(el.files[0]);
});
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (NAV.some(n => n.id === v) && v !== ui.view) { ui.view = v; render(); window.scrollTo(0, 0); }
});
window.addEventListener('pagehide', () => { if (saveTimer) saveLocal(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) saveLocal(); });
// allow dropping a JSON file anywhere on the window
window.addEventListener('dragover', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) { e.preventDefault(); handleImportFile(e.dataTransfer.files[0]); } });

/* ---------------- init ---------------- */
function init() {
  initTooltip();
  try { const u = JSON.parse(localStorage.getItem(LS_UI) || '{}'); ['rmMode', 'rmColor', 'rmMgmtColor'].forEach(k => { if (typeof u[k] === 'string') ui[k] = u[k]; }); ['rmMilestones', 'rmForecast'].forEach(k => { if (typeof u[k] === 'boolean') ui[k] = u[k]; }); } catch (e) { /* ignore */ }
  const res = loadLocal();
  syncStored(); D = derive();
  loadLink();
  const h = location.hash.slice(1); if (NAV.some(n => n.id === h)) ui.view = h;
  render();
  if (res.status === 'unavailable') { ui.saveState = 'error'; updateSaveChip(); toast('Browser storage is unavailable — export JSON regularly to keep your work.', 'warn', 6000); }
  if (res.status === 'corrupt') {
    try { localStorage.setItem('backupdr.corrupt.' + Date.now(), localStorage.getItem(LS_KEY)); } catch (e) { /* ignore */ }
    infoDialog({ title: 'Saved data could not be loaded', html: `<p>The data stored in this browser failed validation, so the application started with a blank project. The unreadable copy was kept aside.</p>${problemList(res.errors || [], 'err')}<p>You can import a JSON export or restore a browser backup from <b>Reports &amp; Data Management</b>.</p>` });
  }
  // automatic daily safety snapshot (only when there is something worth keeping)
  if (res.status === 'ok' && (data.objectives.length || data.risks.length)) {
    const last = readBackups()[0];
    if (!last || Date.now() - new Date(last.at).getTime() > 20 * 3600 * 1000) snapshot('Automatic daily backup');
  }
}
window.addEventListener('error', ev => { try { toast('Unexpected error: ' + ev.message, 'error', 8000); } catch (e) { /* ignore */ } });
window.BackupDR = { version: APP_VERSION, schema: SCHEMA_VERSION, getData: () => data, getDerived: () => D, parseProject, preparePrint, endPrint, roadmapRange, today: () => D.today };
document.addEventListener('DOMContentLoaded', init);

/* =====================================================================
   Linked project file (File System Access API)
   - "Import JSON" (upload arrow) -> dialog: browse for a file, or create a new one (you choose name + place)
   - the status chip in the top bar then writes the latest data back to that same file
   Works in Chrome / Edge / Opera on a computer. Elsewhere (Firefox, Safari, phones, embedded viewers)
   the normal import / download is used instead.
   ===================================================================== */
const FSA = { open: typeof window.showOpenFilePicker === 'function', save: typeof window.showSaveFilePicker === 'function' };
const JSON_TYPES = [{ description: 'Project data (JSON)', accept: { 'application/json': ['.json'] } }];
/* Pickers start in the Downloads folder where the browser supports it (older versions ignore / reject the hint, so retry without it). */
async function pick(fn, opts) {
  try { return await window[fn]({ ...opts, startIn: 'downloads' }); }
  catch (e) { if (e && e.name === 'TypeError') return window[fn](opts); throw e; }
}
let linked = null;               // { handle, name, savedAt }

/* ---- remember the chosen file between visits (IndexedDB can hold file handles) ---- */
function idbOpen() {
  return new Promise((res, rej) => {
    try { const r = indexedDB.open('backupdr.files', 1); r.onupgradeneeded = () => r.result.createObjectStore('handles'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); }
  });
}
async function idbDo(mode, fn) {
  const db = await idbOpen();
  return new Promise((res, rej) => { const tx = db.transaction('handles', mode); const rq = fn(tx.objectStore('handles')); tx.oncomplete = () => { db.close(); res(rq && rq.result); }; tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); }; });
}
const persistLink = () => { if (!linked) return idbDo('readwrite', s => s.delete('linked')).catch(() => {}); return idbDo('readwrite', s => s.put({ handle: linked.handle, savedAt: linked.savedAt }, 'linked')).catch(() => {}); };
async function loadLink() {
  if (!FSA.open && !FSA.save) return;
  try {
    const rec = await idbDo('readonly', s => s.get('linked'));
    if (rec && rec.handle) { linked = { handle: rec.handle, name: rec.handle.name, savedAt: rec.savedAt || null }; updateSaveChip(); }
  } catch (e) { /* storage unavailable: no remembered file */ }
}
function setLink(handle, savedAt) { linked = { handle, name: handle.name, savedAt: savedAt || new Date().toISOString() }; persistLink(); render(); }
function unlinkFile() { linked = null; persistLink(); render(); }
const fileDirty = () => !!linked && (!linked.savedAt || data.meta.modifiedAt > linked.savedAt);

/* ---- writing ---- */
async function ensureWritable(handle) {
  const o = { mode: 'readwrite' };
  if (handle.queryPermission && (await handle.queryPermission(o)) === 'granted') return true;
  if (handle.requestPermission) return (await handle.requestPermission(o)) === 'granted';
  return true;
}
async function writeToHandle(handle) {
  const text = exportText();
  const w = await handle.createWritable();
  try { await w.write(text); await w.close(); } catch (e) { try { await w.abort(); } catch (x) { /* ignore */ } throw e; }
}
function pickerFailed(e, kind) {
  if (e && e.name === 'AbortError') return;                 // the user closed the picker
  if (kind === 'open') { toast('This viewer does not allow choosing a file location, so the normal file chooser is used instead.', 'warn', 6000); classicImport(); }
  else { toast('This viewer does not allow choosing a file location, so the file is downloaded instead.', 'warn', 6000); downloadExport(); }
}
function classicImport() { const fi = $('#fileInput'); fi.value = ''; fi.click(); }

async function saveToLinkedFile() {
  if (!linked) { fileDialog(); return; }
  try {
    if (!(await ensureWritable(linked.handle))) { toast('Permission to change that file was not given, so nothing was written.', 'warn', 6000); return; }
    await writeToHandle(linked.handle);
    linked.savedAt = new Date().toISOString(); persistLink(); renderNav(); updateSaveChip();
    toast(`Saved to ${linked.name}.`, 'ok');
  } catch (e) {
    if (e && (e.name === 'NotFoundError' || e.name === 'InvalidStateError')) {
      const again = await confirmDialog({ title: 'The linked file can’t be found', okLabel: 'Choose a file…', message: `<b>${esc(linked.name)}</b> has been moved, renamed or deleted, so it can’t be updated. Choose a new name and location?` });
      if (again) createNewFile(); else unlinkFile();
    } else toast('Could not write to the file: ' + (e && e.message ? e.message : e), 'error', 8000);
  }
}
async function browseForFile() {
  let hs;
  try { hs = await pick('showOpenFilePicker', { types: JSON_TYPES, multiple: false }); } catch (e) { return pickerFailed(e, 'open'); }
  const handle = hs[0];
  let text, file;
  try { file = await handle.getFile(); text = await file.text(); } catch (e) { toast('Could not read that file.', 'error'); return; }
  const imported = await handleImportText(text, file.name);
  if (imported) { setLink(handle, new Date().toISOString()); toast(`Linked to ${handle.name}. Press the button in the top bar to save your changes back to it.`, 'ok', 6000); }
}
async function createNewFile() {
  let handle;
  try { handle = await pick('showSaveFilePicker', { suggestedName: fileBase() + '.json', types: JSON_TYPES }); } catch (e) { return pickerFailed(e, 'save'); }
  try { await writeToHandle(handle); } catch (e) { toast('Could not write to that file: ' + (e && e.message ? e.message : e), 'error', 8000); return; }
  setLink(handle, new Date().toISOString()); render();
  toast(`Saved to ${handle.name}. Press the button in the top bar any time to update it.`, 'ok', 6000);
}

/* Export JSON: browse for the folder and file name instead of dropping a file into Downloads (a copy; the linked file, if any, is unchanged) */
async function exportToChosenFile() {
  let handle;
  try { handle = await pick('showSaveFilePicker', { suggestedName: stampName(fileBase(), 'json'), types: JSON_TYPES }); } catch (e) { return pickerFailed(e, 'save'); }
  try { await writeToHandle(handle); } catch (e) { toast('Could not write to that file: ' + (e && e.message ? e.message : e), 'error', 8000); return; }
  render(); toast(`Exported to ${handle.name}.`, 'ok', 4500);
}

/* ---- dialog behind the upload arrow ---- */
function fileDialog() {
  const cur = linked ? `<div class="fl-cur"><div><small>Linked file</small><b>${esc(linked.name)}</b><span>${fileDirty() ? 'Has changes not yet written to the file' : 'Up to date' + (linked.savedAt ? ' · saved ' + esc(fmtStamp(new Date(linked.savedAt))) : '')}</span></div>
      <div class="btn-row">${btn('Update file now', 'file-save', '', 'primary', 'save')}${btn('Stop linking', 'file-unlink', '', 'ghost')}</div></div>` : '';
  openModal({
    title: 'Project file', hideSave: true, cancelLabel: 'Close',
    html: `<p class="muted small">Choose a real file on this computer (the chooser opens in your Downloads folder). After that, the button in the top bar (next to Import JSON) writes your latest changes straight back to it.</p>${cur}
      <div class="fl-opts">
        <button type="button" class="fl-opt" data-action="file-browse">${icon('upload', 22)}<span><b>Browse for an existing file…</b><small>Pick a project JSON file. It replaces the current data after you confirm, then stays linked for saving.</small></span></button>
        <button type="button" class="fl-opt" data-action="file-new">${icon('save', 22)}<span><b>Save as a new file…</b><small>Choose the folder <em>and the file name</em>. The current project is written there and stays linked.</small></span></button>
        <button type="button" class="fl-opt" data-action="file-classic">${icon('report', 22)}<span><b>Import once, without linking</b><small>The usual file chooser; the file is not kept linked afterwards.</small></span></button>
      </div>`
  });
}
Object.assign(ACTIONS, {
  'import-json': () => { if (FSA.open) browseForFile(); else classicImport(); },
  'file-dialog': () => fileDialog(),
  'file-browse': () => { closeModal(); browseForFile(); },
  'file-new': () => { closeModal(); createNewFile(); },
  'file-classic': () => { closeModal(); classicImport(); },
  'file-save': () => { closeModal(); saveToLinkedFile(); },
  'file-unlink': () => { unlinkFile(); closeModal(); toast('No longer linked to a file. Autosave in the browser carries on.'); },
  'file-chip': () => { if (linked) saveToLinkedFile(); else if (FSA.save || FSA.open) fileDialog(); else downloadExport(); }
});

})();
</script>
