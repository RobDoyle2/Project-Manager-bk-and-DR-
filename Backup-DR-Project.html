<style>
:root{
  --bg:#F8F8F5;--card:#fff;--ink:#252b29;--ink2:#626d68;--ink3:#6f7a74;--line:#e1e6e3;--line2:#eef1ef;
  --brand:#004d44;--brand-d:#003b34;--brand-soft:#e4f0ec;--accent:#8c7a4b;--gold:#A39161;
  --radius:16px;--shadow:0 1px 2px rgba(37,43,41,.05),0 8px 24px rgba(37,43,41,.06);
  --red:#e5484d;--amber:#f5a524;--green:#22b573;--blue:#3b82f6;
}
*{box-sizing:border-box}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
h1{font-size:1.7rem;letter-spacing:-.02em;line-height:1.15}
h3{font-size:1.02rem}
.muted{color:var(--ink3)}.small{font-size:.82rem}.center{text-align:center}
.ic{flex:none;vertical-align:middle}
[hidden]{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto;z-index:60}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 18px}
.logo{flex:none;width:40px;height:40px;border-radius:11px;line-height:0;box-shadow:0 6px 14px rgba(0,77,68,.30)}.logo svg{display:block;width:40px;height:40px}
.brand-t{flex:1;min-width:0}
.brand b{display:block;font-size:1.05rem;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.brand b.ph{color:var(--ink3);font-weight:600;font-style:italic}
.brand-edit{flex:none;width:30px;height:30px;color:var(--ink3);align-self:flex-start;margin-top:2px}
.brand-edit:hover{color:var(--brand);background:var(--brand-soft)}.brand small{color:var(--ink3);font-size:.76rem}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:.95rem;transition:background .15s,color .15s}
.nav a:hover{background:#f1f3f2;color:var(--ink)}
.nav a.active{background:var(--brand-soft);color:var(--brand-d)}
.nav-badge{margin-left:auto;font-size:.72rem;font-weight:700;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 6px}
.nav-badge.red{background:var(--red);color:#fff}
.side-foot{margin-top:auto;padding-top:14px}
.export-nudge{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:#fff6e0;border:1px solid #f6d995;color:#7a5200;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:.85rem}
.export-nudge small{font-weight:500;opacity:.85}
.export-nudge:hover{background:#ffefc4}
.side-ok{display:flex;gap:8px;align-items:flex-start;color:var(--ink3);font-size:.78rem;padding:6px 10px}
.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:rgba(248,248,245,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line)}
.topbar .hamb{display:none}
.topbar h2{font-size:1rem;font-weight:700;color:var(--ink2)}
.topbar .sp{flex:1}
.save-chip{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;padding:5px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink2);font-weight:600}
.save-chip.saved{color:#13734a;background:#e6f8ef;border-color:#c7ecd9}
.save-chip.error{color:#a3191e;background:#fdeaea;border-color:#f6c4c6}
.save-chip.pending{color:#7a5200;background:#fff6e0;border-color:#f6d995}
#view{padding:24px 28px 70px;width:100%;max-width:1560px;margin:0 auto}
#view:focus{outline:none}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{margin-top:5px;max-width:70ch}
.ph-main{display:flex;align-items:center;gap:15px;min-width:0}.pm-logo{flex:none;display:block;border-radius:14px;box-shadow:0 6px 16px rgba(0,77,68,.28)}
@media (max-width:640px){.pm-logo{width:42px;height:42px}.ph-main{gap:11px;align-items:flex-start}}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 14px;cursor:pointer;font-weight:650;font-size:.9rem;display:inline-flex;gap:7px;align-items:center;justify-content:center;transition:transform .08s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:hover{background:#f1f3f2;box-shadow:0 2px 8px rgba(37,43,41,.08)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(0,77,68,.3)}
.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:.8rem;border-radius:9px}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{background:#c93338}
.btn.danger-t{color:#b3262b}
.btn:focus-visible,.icon-btn:focus-visible,.nav a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.bar:focus-visible{outline:3px solid rgba(0,77,68,.35);outline-offset:1px}
.icon-btn{border:0;background:transparent;border-radius:9px;width:32px;height:32px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink2)}
.icon-btn:hover{background:#eef1ef;color:var(--ink)}
.icon-btn.danger:hover{background:#fdeaea;color:var(--red)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn-col{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.chip-btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;font-size:.78rem;cursor:pointer;font-weight:600}
.chip-btn:hover{background:var(--brand-soft)}
.link-btn{background:none;border:0;padding:0;text-align:left;font-weight:650;color:var(--ink);cursor:pointer}
.link-btn:hover{color:var(--brand-d);text-decoration:underline}

/* ---------- cards / dashboard ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.span2{grid-column:1/-1}
.cols-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.dash-top{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:18px;margin-bottom:18px}
.overall{display:flex;flex-direction:column;align-items:center;gap:8px}
.overall h3{align-self:flex-start}
.ring{width:170px;height:170px}
.ring-bg{fill:none;stroke:#e6ebe8;stroke-width:13}
.ring-fg{fill:none;stroke:var(--brand);stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-t{font-size:30px;font-weight:800;fill:var(--ink)}.ring-s{font-size:12px;fill:var(--ink3);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpi{position:relative;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:transform .12s}
.kpi:hover{transform:translateY(-2px)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--kc,var(--brand))}
.kpi-n{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi-l{font-weight:700;font-size:.95rem}.kpi-s{color:var(--ink3);font-size:.78rem}
.k-brand{--kc:var(--brand)}.k-done{--kc:var(--green)}.k-prog{--kc:var(--blue)}.k-block{--kc:var(--red)}.k-late{--kc:var(--amber)}
.stack{display:flex;height:18px;border-radius:99px;overflow:hidden;background:#eef1ef;gap:2px}
.sg{background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:.82rem;color:var(--ink2)}
.legend.mt{margin-top:16px}
.lg{display:inline-flex;align-items:center;gap:6px}.lg.dim{opacity:.45}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c);display:inline-block}
.obj-mini{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.om{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) 42px;gap:12px;align-items:center;font-size:.86rem}
.om-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.om b{text-align:right}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.list li{display:flex;gap:11px;align-items:flex-start}
.li-main{flex:1;min-width:0;display:flex;flex-direction:column}.li-main b{font-size:.9rem;font-weight:650}.li-main small{color:var(--ink3);font-size:.78rem}
.rel{font-size:.78rem;color:var(--ink3);white-space:nowrap}.rel.bad{color:var(--red);font-weight:700}
.ms-dot{width:12px;height:12px;border-radius:3px;transform:rotate(45deg);background:var(--mc,var(--blue));margin-top:5px;flex:none}
.ms-planned{--mc:#3b82f6}.ms-at-risk{--mc:#f5a524}.ms-achieved{--mc:#22b573}.ms-missed{--mc:#e5484d}
.sec-t{display:flex;align-items:center;gap:7px;font-size:.88rem;margin-bottom:12px}.sec-t.mt{margin-top:20px}
.t-red{color:#c0282d}.t-amber{color:#a76a00}.t-brand{color:var(--brand-d)}
.onboard{display:flex;gap:20px;align-items:flex-start;margin-bottom:18px;background:linear-gradient(135deg,#f1f7f5,#fff 55%);border-color:#cfe3dc}
.onb-ic{width:58px;height:58px;border-radius:18px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.onboard h2{font-size:1.25rem;margin-bottom:6px}.onboard p{color:var(--ink2);max-width:75ch}
.onb-steps{margin:12px 0 16px;padding-left:20px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.onb-actions{display:flex;gap:10px;flex-wrap:wrap}
.empty{text-align:center;padding:60px 20px;background:#fff;border:2px dashed var(--line);border-radius:var(--radius);color:var(--ink2)}
.empty-ic{width:62px;height:62px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px}
.empty h3{font-size:1.15rem;margin-bottom:6px;color:var(--ink)}.empty p{max-width:55ch;margin:0 auto 16px}

/* ---------- status vocabulary ---------- */
.st-not-started{--c:#9aa39f;--cs:#eef1ef;--cd:#4f5a55}
.st-in-progress{--c:#3b82f6;--cs:#dbe9ff;--cd:#1d4ed8}
.st-completed{--c:#22b573;--cs:#d6f5e6;--cd:#13734a}
.st-at-risk{--c:#f5a524;--cs:#fdecc8;--cd:#8a5a00}
.st-blocked,.st-delayed{--c:#e5484d;--cs:#fbdadb;--cd:#a3191e}
.st-on-hold{--c:#a39161;--cs:#f0ebdd;--cd:#6b5b30}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.74rem;font-weight:700;background:var(--cs);color:var(--cd);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.prio{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:7px;background:#eef1ef;color:var(--ink2)}
.prio-high{background:#ffe9d6;color:#9a4300}.prio-critical{background:#fde0e1;color:#a3191e}.prio-low{background:#e8f4ee;color:#25704c}
.idchip{font-size:.7rem;font-weight:700;letter-spacing:.03em;color:var(--ink3);background:#eef1ef;padding:2px 7px;border-radius:7px;white-space:nowrap}
.avatar-wrap{display:inline-flex;align-items:center;gap:8px;min-width:0}
.avatar{width:26px;height:26px;border-radius:50%;color:#fff;font-size:.68rem;font-weight:700;display:inline-grid;place-items:center;flex:none}
.av-name{font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:9px;border-radius:99px;background:#e6ebe8;overflow:hidden;flex:1;min-width:40px}
.pbar>i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .35s}
.slip{font-size:.72rem;font-weight:700;padding:1px 6px;border-radius:6px}.slip.bad{background:#fde0e1;color:#a3191e}.slip.good{background:#d6f5e6;color:#13734a}
.fc{font-size:.76rem;color:#8a5a00;background:#fff4d6;padding:2px 8px;border-radius:7px;display:inline-block}
.callout{display:flex;gap:9px;align-items:flex-start;padding:10px 14px;border-radius:12px;font-size:.88rem;margin:10px 0}
.callout.red{background:#fdeaea;color:#8f1d22;border:1px solid #f6c4c6}.callout.amber{background:#fff6e0;color:#7a5200;border:1px solid #f6d995}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:7px;background:#eef1ef;color:var(--ink2);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.chip.red{background:#fde0e1;color:#a3191e}.chip.amber{background:#fff0cc;color:#8a5a00}

/* ---------- toolbars ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search,.toolbar select,.fld input,.fld select,.fld textarea,.dep-row input,.dep-row select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;min-height:38px}
.search{min-width:240px;flex:1;max-width:380px}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:.88rem;color:var(--ink2);cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--brand)}
.toolbar .seg,.seg[role=tablist]{background:#e6ebe8;border-radius:12px;padding:4px;gap:2px;display:inline-flex}
.seg[role=tablist] button{border:0;background:transparent;padding:7px 16px;border-radius:9px;font-weight:650;cursor:pointer;color:var(--ink2)}
.seg[role=tablist] button.on{background:#fff;color:var(--brand-d);box-shadow:0 2px 6px rgba(37,43,41,.12)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:650;color:var(--ink3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand-d);border-bottom-color:var(--brand)}
.count{font-size:.72rem;background:#eef1ef;border-radius:99px;padding:1px 8px;margin-left:4px}.count.red{background:var(--red);color:#fff}

/* ---------- objectives ---------- */
.obj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.obj-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;border-top:5px solid var(--c);display:flex;flex-direction:column;gap:10px}
.obj-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.obj-ids{display:flex;gap:6px;align-items:center}
.obj-title{font-size:1.12rem;letter-spacing:-.01em}
.obj-desc{color:var(--ink2);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.obj-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--ink2)}
.dates{display:inline-flex;gap:5px;align-items:center}
.obj-prog{display:flex;align-items:center;gap:12px}.obj-prog b{min-width:42px;text-align:right}
.obj-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2)}
.obj-actions{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}.sp{flex:1}
.obj-tasks{border-top:1px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.mini-task{display:grid;grid-template-columns:minmax(0,1fr) auto 40px;gap:10px;align-items:center;border:0;background:#f1f3f2;border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}
.mini-task:hover{background:var(--brand-soft)}.mt-n{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mt-p{text-align:right;font-weight:700;font-size:.82rem}

/* ---------- tasks table ---------- */
.t-group{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.t-group-h{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;background:linear-gradient(90deg,var(--cs),#fff 70%);flex-wrap:wrap}
.tg-l{display:flex;gap:14px;align-items:center}.tg-bar{width:6px;height:38px;border-radius:6px;background:var(--c)}
.t-group-h small{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px}
.tg-r{display:flex;gap:14px;align-items:center}.tg-prog{display:flex;gap:10px;align-items:center;width:210px}.tg-prog b{min-width:40px;text-align:right}
.t-head,.t-row{display:grid;grid-template-columns:minmax(250px,2.3fr) 150px 175px 84px 125px 175px 108px;gap:12px;align-items:center;padding:0 20px}
.t-head{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700;padding-top:10px;padding-bottom:8px;border-bottom:1px solid var(--line2);border-top:1px solid var(--line2)}
.t-row{padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--line2);font-size:.88rem}
.t-row:last-child{border-bottom:0}
.t-row:hover{background:#fafbfa}
.t-row.lvl-2{background:#fafbfa}
.t-row.lvl-2 .t-name{padding-left:34px}
.t-row.is-blocked{box-shadow:inset 4px 0 0 var(--red);background:#fff8f8}
.t-name{display:flex;gap:8px;align-items:flex-start;min-width:0}
.t-name-txt{min-width:0;display:flex;flex-direction:column;gap:3px}
.sub{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.blocker-txt{font-size:.76rem;color:#a3191e}
.chev{border:0;background:#eef1ef;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink2);transition:transform .15s}
.chev.open{transform:rotate(90deg)}.chev-sp{width:24px;flex:none}
.prog-ctl{display:flex;align-items:center;gap:8px}
.prog-ctl input[type=range]{flex:1;accent-color:var(--c);min-width:70px}
.ptxt{font-weight:700;min-width:38px;text-align:right}
.prog-auto{display:flex;align-items:center;gap:8px}.auto{color:var(--ink3);font-size:.7rem;text-transform:uppercase;font-weight:700}
.t-act{display:flex;gap:2px;justify-content:flex-end}
.pad{padding:16px 20px}.foot{margin-top:6px}

/* ---------- risks ---------- */
.risk-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.heat-card{max-width:300px}
.heat-card h4{margin-bottom:10px}
.heat{border-collapse:separate;border-spacing:3px;width:100%}.heat caption{font-size:.7rem;color:var(--ink3);margin-bottom:6px;text-align:left}
.heat th{font-size:.7rem;color:var(--ink3);font-weight:600;width:14%}
.hm{height:34px;text-align:center;font-weight:800;border-radius:7px}
.band{font-size:.74rem;font-weight:800;padding:2px 9px;border-radius:7px;display:inline-block;white-space:nowrap}
.band-low{background:#d6f5e6;color:#13734a}.band-medium{background:#fdecc8;color:#8a5a00}.band-high{background:#ffd9c2;color:#9a4300}.band-critical{background:#fbc9cb;color:#8f1d22}
.r-table,.d-table{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.r-head,.r-row{display:grid;grid-template-columns:minmax(220px,3fr) 120px 135px 120px 140px 105px 76px;gap:12px;align-items:center;padding:12px 18px}
.b-table .r-head,.b-table .r-row{grid-template-columns:minmax(200px,2fr) minmax(200px,2.4fr) 150px 170px 140px}
.r-head,.d-head{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700;border-bottom:1px solid var(--line2);padding-top:10px;padding-bottom:8px}
.r-row,.d-row{border-bottom:1px solid var(--line2);font-size:.88rem}.r-row:last-child,.d-row:last-child{border-bottom:0}
.r-row.closed{opacity:.55}.r-row.blocked{box-shadow:inset 4px 0 0 var(--red)}
.r-main{display:flex;flex-direction:column;gap:3px;min-width:0}.r-main small{color:var(--ink2)}
.rs{font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:99px;background:#eef1ef}.rs-open{background:#fde0e1;color:#a3191e}.rs-mitigating{background:#fff0cc;color:#8a5a00}.rs-accepted{background:#e7ecea;color:#4f5a55}.rs-closed{background:#d6f5e6;color:#13734a}

/* ---------- dependencies ---------- */
.d-head,.d-row{display:grid;grid-template-columns:200px minmax(160px,1.5fr) 30px minmax(160px,1.5fr) 100px minmax(120px,1fr) 76px;gap:12px;align-items:center;padding:12px 18px}
.d-main{display:flex;flex-wrap:wrap;gap:5px;align-items:center}.arrow{color:var(--ink3);font-size:1.2rem;text-align:center}
.ds{font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:99px}
.ds-open{background:#dbe9ff;color:#1d4ed8}.ds-at-risk{background:#fdecc8;color:#8a5a00}.ds-satisfied{background:#d6f5e6;color:#13734a}
.matrix-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;overflow:auto}
.matrix{border-collapse:collapse;min-width:100%}
.matrix th,.matrix td{border:1px solid var(--line2);padding:0}
.matrix .corner{padding:10px;font-size:.78rem;text-align:left;vertical-align:bottom;background:#fafbfa;min-width:200px}
.matrix th.col{height:150px;width:46px;background:#fafbfa;vertical-align:bottom}
.matrix th.col span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;padding:8px 4px;font-size:.78rem;font-weight:600;max-height:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.matrix th.col small{color:var(--ink3);font-weight:500}
.matrix th.row{text-align:left;font-size:.82rem;padding:8px 10px;font-weight:600;background:#fafbfa}.matrix th.row small{display:block;color:var(--ink3);font-weight:500}
.matrix td{height:40px;text-align:center}
.mx-dot{width:20px;height:20px;border-radius:50%;border:0;cursor:pointer;background:var(--blue)}
.mx-dot.ds-at-risk{background:var(--amber)}.mx-dot.ds-satisfied{background:var(--green)}.mx-dot.ds-open{background:var(--blue)}
.mx-dot.conf{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--red)}
.dot.ds-open{background:var(--blue)}.dot.ds-at-risk{background:var(--amber)}.dot.ds-satisfied{background:var(--green)}.conf-d{background:#fff;border:2px solid var(--red)}

/* ---------- milestones ---------- */
.ms-list{display:flex;flex-direction:column;gap:14px}
.ms-card{display:flex;gap:18px;align-items:center}
.ms-diamond{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:var(--mc);background:#f1f3f2;flex:none}
.ms-diamond.ms-planned{background:#e4efff}.ms-diamond.ms-at-risk{background:#fff0cc}.ms-diamond.ms-achieved{background:#d6f5e6}.ms-diamond.ms-missed{background:#fde0e1}
.ms-body{flex:1;min-width:0}.ms-top{display:flex;gap:8px;align-items:center;margin-bottom:4px}.ms-body h3{margin-bottom:2px}
.ms-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:.86rem;color:var(--ink2);margin-top:6px}.ms-meta span{display:inline-flex;gap:6px;align-items:center}

/* ---------- reports & data ---------- */
.rep-grid h3{display:flex;gap:9px;align-items:center;margin-bottom:8px}
.data-stat{display:flex;gap:10px 22px;flex-wrap:wrap;margin:10px 0 14px;font-size:.9rem;color:var(--ink2)}
.bk-list{display:flex;flex-direction:column;gap:8px}
.bk{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line2);border-radius:12px;padding:10px 14px;flex-wrap:wrap}.bk small{display:block;color:var(--ink3)}

/* ---------- modal / forms ---------- */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;color:var(--ink)}
dialog::backdrop{background:rgba(37,43,41,.5);backdrop-filter:blur(3px)}
dialog[open]{display:block;margin:auto;animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.modal-card{background:#fff;border-radius:20px;width:min(640px,94vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(37,43,41,.4);overflow:hidden;margin:0}
.modal-card.wide{width:min(840px,95vw)}.modal-card.small{width:min(520px,94vw)}
.modal-card header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-card header h3{font-size:1.15rem}
.modal-body{padding:20px 22px;overflow:auto;flex:1}
.modal-card footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:#fafbfa}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}.fld.full,.full{grid-column:1/-1}
.fl{font-size:.8rem;font-weight:700;color:var(--ink2)}
.fld textarea{resize:vertical;min-height:60px}
.fld input:focus,.fld select:focus,.fld textarea:focus,.search:focus,.toolbar select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,77,68,.18)}
.hint{color:var(--ink3);font-size:.76rem;font-weight:400}.hint.inline{font-weight:500}
.form-error{background:#fdeaea;color:#8f1d22;border:1px solid #f6c4c6;border-radius:10px;padding:9px 12px;margin-top:14px;font-size:.88rem;font-weight:600}
.form-error.inline{display:inline-block;margin:0 0 0 10px}
.calc-box{background:#f1f3f2;border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.warn-note{background:#fff6e0;color:#7a5200;border-radius:10px;padding:8px 12px;font-size:.84rem}
.notes{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px;max-height:140px;overflow:auto}
.notes li{background:#f1f3f2;border-radius:9px;padding:6px 10px;font-size:.85rem}.nd{display:block;font-size:.7rem;font-weight:700;color:var(--ink3)}
.fc-details{border:1px dashed var(--line);border-radius:12px;padding:10px 14px}.fc-details summary{cursor:pointer;font-weight:650;font-size:.88rem}.fc-details .fgrid{margin-top:12px}
.blockbox{border:1px solid #f3d3d4;border-radius:12px;padding:12px;background:#fffafa}
.auto-prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:38px}
.prog-ed{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.prog-ed input{width:90px}.quick{display:flex;gap:5px;flex-wrap:wrap}
.dep-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.dep-row{display:grid;grid-template-columns:150px minmax(0,1.5fr) 100px minmax(0,1fr) 32px;gap:8px;align-items:center}
.dep-row .dep-target select,.dep-row .dep-target input{width:100%}
.cmp{display:flex;gap:14px;align-items:stretch;margin:14px 0;flex-wrap:wrap}
.cmp>div:not(.cmp-arrow){flex:1;min-width:190px;background:#f1f3f2;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;font-size:.84rem}.cmp small{color:var(--ink3);text-transform:uppercase;font-weight:700;font-size:.68rem}
.cmp-arrow{align-self:center;font-size:1.4rem;color:var(--ink3)}
.issues{margin:8px 0;padding:10px 12px 10px 28px;border-radius:10px;font-size:.84rem;max-height:200px;overflow:auto}
.issues.err{background:#fdeaea;color:#8f1d22}.issues.warn{background:#fff6e0;color:#7a5200}
.confirm-msg{line-height:1.5}

/* ---------- toast / tooltip ---------- */
#toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#252b29;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:.9rem;font-weight:600;transform:translateY(12px);opacity:0;transition:all .25s;max-width:min(420px,90vw)}
.toast.in{transform:none;opacity:1}.toast.warn{background:#8a5a00}.toast.error{background:#b3262b}
#tip{position:fixed;z-index:300;pointer-events:none;background:#252b29;color:#fff;font-size:.78rem;line-height:1.4;padding:8px 11px;border-radius:9px;max-width:320px;white-space:pre-line;box-shadow:0 8px 24px rgba(0,0,0,.3)}

/* ---------- GANTT ---------- */
.rm-card{padding:14px}
.gantt{--labelw:330px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.gantt-scroll{overflow-x:auto}
.gantt-inner{min-width:calc(var(--labelw) + 720px);position:relative}
.g-head{display:flex;border-bottom:1px solid var(--line);background:#fafbfa}
.g-lab{flex:0 0 var(--labelw);width:var(--labelw);position:sticky;left:0;z-index:6;background:#fff;border-right:1px solid var(--line);min-width:0}
.g-lab-head{background:#fafbfa;display:flex;align-items:flex-end;padding:10px 16px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.g-lab-head .tl-h{width:100%}
.g-months{flex:1;display:flex;min-width:0}
.g-month{border-left:1px solid var(--line);padding:9px 4px 8px;text-align:center;display:flex;flex-direction:column;min-width:0;line-height:1.2}
.g-month b{font-size:.84rem;white-space:nowrap}.g-month small{color:var(--ink3);font-size:.7rem;font-weight:600}
.g-body{position:relative}
.g-grid{position:absolute;left:var(--labelw);right:0;top:0;bottom:0;display:flex;pointer-events:none;z-index:1}
.g-gl{border-left:1px solid var(--line2)}.g-gl:first-child{border-left:0}
.g-today-wrap{position:absolute;inset:0}
.g-today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);z-index:3}
.g-today span{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:.62rem;font-weight:700;padding:1px 6px;border-radius:0 0 6px 6px}
.g-row{display:flex;border-bottom:1px solid var(--line2);position:relative}
.g-row:last-child{border-bottom:0}
.g-track{flex:1;position:relative;z-index:2;min-width:0}
.g-empty{padding:34px 24px;text-align:center;color:var(--ink3)}
.g-ms-row{background:linear-gradient(#fafbfa,#fff)}
.m-lab{padding:8px 16px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.ml-name{display:flex;gap:7px;align-items:center;min-width:0}.ml-name b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.ml-sub{font-size:.76rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml-pill{display:flex;gap:8px;align-items:center}.ml-pct{font-weight:800;font-size:.88rem}
.ms-ico{color:var(--brand)}
.bar{position:absolute;border-radius:9px;background:var(--cs);overflow:visible;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);transition:filter .15s,transform .12s}
.bar:hover{filter:brightness(.96);transform:translateY(-1px)}
.bar-in{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--c)}
.bar.narrow .chip-p{left:calc(100% + 5px)}
.bar-note{position:absolute;z-index:3;font-size:.68rem;font-weight:700;color:#a3191e;white-space:nowrap;line-height:20px;margin:0 6px}
.bar-note.nn{margin-left:58px}
.bar .chip-p{position:absolute;left:6px;top:50%;transform:translateY(-50%);background:#fff;color:var(--cd);font-size:.7rem;font-weight:800;padding:1px 7px;border-radius:99px;box-shadow:0 1px 3px rgba(0,0,0,.18);white-space:nowrap}
/* work-level colours: objective = deep pink, tasks and subtasks = one lighter pink */
.bar.is-blocked{box-shadow:0 0 0 2px var(--red)}
.bar.is-late{outline:2px dashed var(--red);outline-offset:1px}
.fbar{position:absolute;border-radius:5px;border:1.5px dashed var(--amber);background:repeating-linear-gradient(135deg,rgba(245,165,36,.35) 0 4px,rgba(245,165,36,.08) 4px 8px);z-index:2}
.fbar.late{border-color:var(--red);background:repeating-linear-gradient(135deg,rgba(229,72,77,.32) 0 4px,rgba(229,72,77,.07) 4px 8px)}
.ms-pt{position:absolute;top:0;z-index:5;cursor:pointer;height:100%}
.ms-pt .dia{position:absolute;left:-8px;top:4px;width:16px;height:16px;transform:rotate(45deg);background:var(--mc);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);border-radius:4px}
.ms-pt.small{height:auto}.ms-pt.small .dia{width:12px;height:12px;left:-6px;top:0}
.ms-lab{position:absolute;left:-7px;white-space:nowrap;font-size:.68rem;font-weight:700;color:var(--ink);background:rgba(255,255,255,.9);padding:0 4px;border-radius:4px;line-height:14px}
.ms-lab.r{left:auto;right:-7px}
.g-ms-line{position:absolute;left:var(--labelw);right:0;top:0;bottom:0;z-index:1;pointer-events:none}
.ms-vline{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--mc);opacity:.5}
.rm-legend{margin-top:14px;padding:0 4px}
.dia-lg{width:11px;height:11px;transform:rotate(45deg);background:var(--blue);border-radius:2px;display:inline-block}
.fb-lg{width:20px;height:8px;border:1.5px dashed var(--amber);border-radius:4px;display:inline-block;background:repeating-linear-gradient(135deg,rgba(245,165,36,.35) 0 3px,transparent 3px 6px)}
.td-lg{width:3px;height:14px;background:var(--accent);display:inline-block;border-radius:2px}
.bl-lg{width:18px;height:10px;border-radius:4px;box-shadow:0 0 0 2px var(--red);display:inline-block;background:#fff}

.rm-note{margin-top:10px;font-size:.8rem;color:#8a5a00;background:#fff6e0;padding:6px 12px;border-radius:9px}
.gantt.compact .gantt-inner{min-width:calc(var(--labelw) + 640px)}.gantt.compact .g-month b{font-size:.74rem}
.gantt.compact .m-lab{padding:4px 12px}
/* technical rows */
.tl{display:grid;grid-template-columns:minmax(0,1fr) 98px 44px 106px;align-items:center;gap:6px}
.g-lab.tl{padding:0 10px 0 4px}
.tl-h{font-size:.72rem}.tl-h>div:first-child{padding-left:0}
.tl-name{display:flex;gap:6px;align-items:center;min-width:0}
.tl-txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.tl-txt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.86rem}
.tl-txt small{color:var(--ink3);font-size:.7rem;display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden}
.tl-owner{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.tl-pct{font-weight:800;font-size:.8rem;text-align:right}
.tl-stat .pill{font-size:.66rem;padding:2px 8px}
.g-row.t-r.lvl-0 .g-lab{background:#f1f3f2}.g-row.t-r.lvl-0 .tl-txt b{font-size:.92rem}
.g-row.t-r.lvl-2 .g-lab{background:#fafbfa}
.g-row.t-r.lvl-0{background:#fafbfa}
.g-row.t-r .chev{width:20px;height:20px;border-radius:6px}

/* ---------- print ---------- */
#printArea{display:none}
.print-sheet{font-size:11px;color:#111}
.ps-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;border-bottom:3px solid var(--brand);padding-bottom:8px}
.ps-head h1{font-size:20px}.ps-head p{color:#555;margin-top:2px;font-size:12px}.ps-meta{text-align:right;font-size:12px}.ps-meta b{font-size:22px;color:var(--brand-d)}
.print-sheet .gantt{--labelw:230px!important;border-radius:6px}
.print-sheet .gantt-inner{min-width:0!important}.print-sheet .gantt-scroll{overflow:visible}
.print-sheet .g-lab{position:static}.print-sheet .gantt-tech{--labelw:340px!important}
.print-sheet .m-lab{padding:5px 10px}.print-sheet .ml-name b{font-size:11px}.print-sheet .ml-sub{font-size:9px}
.print-sheet .g-row,.print-sheet .bar,.print-sheet .t-r{break-inside:avoid;page-break-inside:avoid}
.print-sheet .bar:hover{transform:none;filter:none}
@media print{
  html{font-size:13px}
  body{background:#fff}
  body.printing .app,body.printing #toasts,body.printing #tip{display:none!important}
  body.printing #printArea{display:block}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}

/* ---------- responsive ---------- */
@media (max-width:1400px){
  .t-head{display:none}
  .t-row{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:8px;padding-top:14px;padding-bottom:14px}
  .t-row .t-name{grid-column:1/-1}.t-row .t-act{grid-column:4;grid-row:1;justify-self:end}
  .t-row .t-name{grid-column:1/4}
  .t-row [data-label]:not(.t-name)::before{content:attr(data-label);display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700;margin-bottom:2px}
  .t-row .t-dates{grid-column:span 2}.t-row .t-prog{grid-column:span 2}
  .r-head,.d-head{display:none}
  .r-row{grid-template-columns:repeat(3,minmax(0,1fr))}.r-row .r-main{grid-column:1/-1}.r-row .t-act{grid-column:3}
  .b-table .r-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .r-row [data-label]::before,.d-row [data-label]::before{content:attr(data-label);display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700}
  .d-row{grid-template-columns:repeat(2,minmax(0,1fr))}.d-row .d-main{grid-column:1/-1}.d-row .arrow{display:none}.d-row .t-act{grid-column:2}
}
@media (max-width:1100px){
  .dash-top{grid-template-columns:1fr}.overall{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .grid-2{grid-template-columns:1fr}.cols-3{grid-template-columns:1fr}
  }
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .sidebar.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(37,43,41,.45);z-index:55}
  .topbar{padding:10px 14px}.topbar .hamb{display:inline-grid}
  #view{padding:18px 14px 60px}
  h1{font-size:1.4rem}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:1fr}
  .dep-row{grid-template-columns:1fr 1fr}.dep-row .dep-target{grid-column:1/-1}
  .modal-card,.modal-card.wide{width:100vw;max-height:100vh;height:100vh;border-radius:0}
  dialog[open]{margin:0}
  .obj-grid{grid-template-columns:1fr}
  .search{min-width:0;max-width:none}
  .ms-card{flex-wrap:wrap}
  .gantt{--labelw:170px!important}
  .gantt-tech{--labelw:230px!important}
  .gantt-inner{min-width:calc(var(--labelw) + 720px)}
  .tl{grid-template-columns:minmax(0,1fr) 40px}.tl-owner,.tl-stat,.tl-h .tl-owner,.tl-h .tl-stat{display:none}
  .m-lab{padding:6px 10px}.ml-pill .pill{font-size:.64rem;padding:2px 7px}
  .tg-prog{width:150px}
  #toasts{left:14px;right:14px;bottom:14px}
}
@media (max-width:560px){
  .t-row{grid-template-columns:repeat(2,minmax(0,1fr))}.t-row .t-name{grid-column:1/-1}.t-row .t-act{grid-column:2;grid-row:auto;justify-self:end}
  .t-row .t-dates,.t-row .t-prog{grid-column:1/-1}
  .r-row{grid-template-columns:repeat(2,minmax(0,1fr))}.r-row .t-act{grid-column:2}
  .page-head{align-items:flex-start}
}

/* ---------- additions: modal error bar, bulk add ---------- */
.modal-err{margin:0;border-radius:0;border-left:0;border-right:0;border-bottom:0;padding:10px 22px}
.fld input.invalid,.fld select.invalid,.fld textarea.invalid{border-color:var(--red)!important;box-shadow:0 0 0 3px rgba(229,72,77,.2)!important}
.csv-box{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;background:#fafbfa}
.csv-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.csv-info{font-size:.84rem;color:#13734a;background:#e6f8ef;border-radius:8px;padding:6px 10px;margin-top:4px}

.tb-btn svg{margin-right:5px}
button.save-chip{font-family:inherit;line-height:1.2;cursor:pointer;max-width:min(48vw,340px);white-space:nowrap}
button.save-chip:hover{border-color:var(--brand)}
.save-chip .chip-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.save-chip.file-ok{color:#13734a;background:#e6f8ef;border-color:#c7ecd9}
.save-chip.file-dirty{color:#fff;background:var(--brand);border-color:var(--brand)}
.save-chip.file-dirty:hover{background:var(--brand-d)}
.fl-opts{display:grid;gap:10px;margin-top:14px}
.fl-opt{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:inherit;color:var(--ink)}
.fl-opt:hover,.fl-opt:focus-visible{border-color:var(--brand);background:var(--brand-soft)}
.fl-opt .ic{flex:none;color:var(--brand);margin-top:2px}
.fl-opt b{display:block;margin-bottom:2px}
.fl-opt small{color:var(--ink2);font-size:.82rem;line-height:1.35}
.fl-cur{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;background:var(--brand-soft)}
.fl-cur small{display:block;color:var(--ink2);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
.fl-cur b{display:block}.fl-cur span{color:var(--ink2);font-size:.85rem}
@media (max-width:640px){.tb-btn span{display:none}.tb-btn svg{margin:0}.tb-btn{padding:6px 9px}.save-chip{font-size:.72rem;padding:4px 8px}.topbar{gap:8px}.topbar h2{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}}

.json-box{width:100%;font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:.78rem;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfa;resize:vertical}
.mt{margin-top:12px}

/* ---------- objective colour system ---------- */
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;flex:none}
.t-row{border-left:5px solid var(--ol,transparent)}
.g-gl{border-left-color:#E5E7EB}.g-month{border-left-color:#E5E7EB}
.gantt-inner,.g-body{background:#fff}
.bar.oc{border-radius:8px;box-shadow:none}
.bar.oc-o{background:var(--oc);color:#fff}
.bar.oc-t{background:var(--ol);color:#1F2937;box-shadow:inset 0 0 0 1px rgba(31,41,55,.08)}
.bar.oc .bar-in{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.bar.oc .strip{position:absolute;left:0;bottom:0;height:4px}
.bar.oc-o .strip{background:rgba(255,255,255,.92)}.bar.oc-t .strip{background:rgba(31,41,55,.55)}
.bar-txt{position:absolute;left:8px;right:6px;top:0;bottom:4px;display:flex;align-items:center;gap:5px;font-size:.72rem;white-space:nowrap;overflow:hidden;pointer-events:none}
.bar-txt b{font-weight:800}.bar-txt .bn{overflow:hidden;text-overflow:ellipsis;font-weight:700}
.bar.oc-o .bar-txt{color:#fff}.bar.oc-t .bar-txt{color:#1F2937}
.bar.oc.narrow .bar-txt{left:calc(100% + 6px);right:auto;color:#1F2937;overflow:visible}
.bar.oc.is-blocked{box-shadow:0 0 0 2px #E5484D}
.bar.oc.is-late{outline:2px dashed #E5484D;outline-offset:2px}
/* objective label cells stay plain (as on the Objectives tab); the objective colour is a stripe on the left */
.m-lab .ml-sub{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.m-lab .ml-dates{display:inline-flex;gap:4px;align-items:center;color:var(--ink2);white-space:nowrap}
.m-lab .avatar-wrap .av-name{max-width:140px}
.m-lab .ml-name b{font-size:1.02rem;color:var(--ink)}
/* milestones: objective colour, status as a glyph (never colour alone) */
.ms-pt .dia{background:var(--mc)}
.ms-pt .dia::after{content:attr(data-g);position:absolute;inset:0;display:grid;place-items:center;transform:rotate(-45deg);color:#fff;font-size:10px;font-weight:900;line-height:1}
.ms-vline{border-left-color:var(--mc)}
.ms-diamond{color:var(--mc)}
.legend .lg .sw{margin-right:2px}
.gantt.compact .m-lab .ml-name b{font-size:.84rem}

/* Christmas break band (24 Dec - 2 Jan): light grey, behind the bars */
.g-xmas{position:absolute;top:0;bottom:0;background:rgba(148,158,152,.20);border-left:1px solid rgba(120,130,125,.25);border-right:1px solid rgba(120,130,125,.25)}
.g-xmas span{position:absolute;left:50%;bottom:8px;transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7b857f;white-space:nowrap}
.gantt.compact .g-xmas span{font-size:.56rem;letter-spacing:.04em}
.xm-lg{width:14px;height:12px;background:rgba(148,158,152,.35);border:1px solid rgba(120,130,125,.4);display:inline-block;border-radius:3px}

/* ---------- links ---------- */
.link-head,.link-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 32px;gap:8px;align-items:center}
.link-head{font-size:.72rem;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;padding:0 2px}
.link-list{display:flex;flex-direction:column;gap:8px;margin:4px 0 8px}
.link-row input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;min-height:38px;width:100%}
.link-row input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,77,68,.18)}
.lnks{display:inline-flex;flex-wrap:wrap;gap:6px}
.lnk{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:650;padding:2px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand-d);text-decoration:none;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;cursor:pointer}
.lnk:hover{background:#d3e7e1;text-decoration:underline}
.lnk.plain{background:#eef1ef;color:var(--ink2)}
.obj-links{margin-top:-2px}
@media (max-width:900px){.link-head{display:none}.link-row{grid-template-columns:1fr 32px}.link-row input[name=lUrl]{grid-column:1}}

/* ---------- read-only objective view ---------- */
.vw{display:flex;flex-direction:column;gap:14px}
.vw-top{display:flex;gap:14px;align-items:stretch}
.vw-stripe{width:6px;border-radius:6px;background:var(--oc);flex:none}
.vw-ids{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.vw-title{font-size:1.35rem;letter-spacing:-.01em}
.vw-prog{display:flex;gap:12px;align-items:center}.vw-prog b{min-width:42px}
.vw-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding-top:12px;border-top:1px solid var(--line2)}

<script>
(function () {
'use strict';
/* =====================================================================
   Programme Manager — core: constants, dates, data model,
   validation, central progress engine, persistence
   ===================================================================== */
const SCHEMA_VERSION = 1;
const APP_ID = 'backup-dr-project';
const APP_VERSION = '1.4.3';
const LS_KEY = 'backupdr.project.v1';
const LS_BACKUPS = 'backupdr.backups.v1';
const LS_UI = 'backupdr.ui.v1';
const PREFIX = { objective: 'OBJ', task: 'TSK', subtask: 'SUB', risk: 'RSK', dependency: 'DEP', milestone: 'MS' };
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = MONTHS.map(m => m.slice(0, 3));
const PRIORITIES = ['Low', 'Medium', 'High', 'Critical'];
const LEAF_STATUSES = ['not-started', 'in-progress', 'at-risk', 'on-hold', 'completed'];
const FLAG_STATUSES = ['at-risk', 'on-hold'];
const STATUS_LABEL = {
  'not-started': 'Not started', 'in-progress': 'In progress', 'completed': 'Completed',
  'at-risk': 'At risk', 'blocked': 'Blocked', 'delayed': 'Delayed', 'on-hold': 'On hold'
};
const STATUS_ORDER = ['not-started', 'in-progress', 'completed', 'at-risk', 'blocked', 'delayed', 'on-hold'];
const RISK_STATUS = ['open', 'mitigating', 'accepted', 'closed'];
const MS_STATUS = ['planned', 'at-risk', 'achieved'];
const DEP_TYPES = { task: 'Task dependency', objective: 'Objective dependency', asset: 'Asset dependency', recovery: 'Recovery dependency' };
const DEP_STATUS = ['open', 'at-risk', 'satisfied'];
const IMPACT = ['Very low', 'Low', 'Medium', 'High', 'Very high'];
const LIKELIHOOD = ['Rare', 'Unlikely', 'Possible', 'Likely', 'Almost certain'];
const DAY = 86400000;

/* Objective colour identity: one strong colour per objective, one lighter shade for ALL its tasks/subtasks. */
const PALETTE = [
  { n: 'Emerald Green', c: '#006B5B', l: '#C0DDD6' }, { n: 'Royal Blue', c: '#315DA8', l: '#C6D3E9' },
  { n: 'Deep Purple', c: '#65449A', l: '#D3C7E5' }, { n: 'Burnt Orange', c: '#C45B32', l: '#EED0C1' },
  { n: 'Teal', c: '#147E91', l: '#C0DDE1' }, { n: 'Ochre Gold', c: '#A17A20', l: '#E8DDBB' },
  { n: 'Slate Blue', c: '#526B82', l: '#C9D4DC' }, { n: 'Berry', c: '#963E60', l: '#E6C6D2' },
  // extension for programmes with more than eight objectives
  { n: 'Forest Olive', c: '#5A7D2A', l: '#D6E2BE' }, { n: 'Plum', c: '#8B2F86', l: '#E6C9E4' },
  { n: 'Coffee Brown', c: '#7A5230', l: '#E2D3C5' }, { n: 'Crimson', c: '#B1333F', l: '#F0CDD1' },
  { n: 'Sage Green', c: '#5F8A63', l: '#D1E1D3' }, { n: 'Charcoal', c: '#4B5563', l: '#D1D5DB' }
];
const SYS_COL = { n: 'Unassigned', c: '#64748B', l: '#E2E8F0' };
function hexHSL(h) {
  const r = parseInt(h.slice(1, 3), 16) / 255, g = parseInt(h.slice(3, 5), 16) / 255, b = parseInt(h.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let hue = 0;
  if (d) hue = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: (hue * 60 + 360) % 360, l, s: d ? d / (1 - Math.abs(2 * l - 1)) : 0 };
}
function similarCol(a, b) {
  const x = hexHSL(a.c), y = hexHSL(b.c);
  const dh = Math.min(Math.abs(x.h - y.h), 360 - Math.abs(x.h - y.h));
  return dh < 26 && Math.abs(x.l - y.l) < 0.18 && x.s > 0.15 && y.s > 0.15;
}
const validCI = v => Number.isInteger(v) && v >= 0;
/* ---- links attached to objectives / tasks / subtasks: [{name, url}] ---- */
const BAD_SCHEME = /^\s*(javascript|data|vbscript):/i;
function normLink(url) {
  url = String(url || '').trim();
  if (!url || BAD_SCHEME.test(url)) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(url) && !url.startsWith('\\\\') && !url.startsWith('/') && /^[^\s]+\.[^\s]+$/.test(url)) return 'https://' + url;   // www.example.com -> https://...
  return url;
}
const linkHref = u => /^(https?:|mailto:|ftp:|file:)/i.test(u) ? u : null;
function linkLabel(l) {
  if (l.name && l.name.trim()) return l.name.trim();
  try { return new URL(l.url).hostname || l.url; } catch (e) { return l.url; }
}
function objCol(o) { return (!o || o.system) ? SYS_COL : PALETTE[(validCI(o.colorIndex) ? o.colorIndex : 0) % PALETTE.length]; }
/* Give every objective that has no colour the next unused palette slot (avoiding a look-alike of its neighbour).
   Existing assignments are never changed, so deleting or reordering objectives cannot recolour the rest. */
function assignColours(d = data) {
  const real = d.objectives.filter(o => !o.system);
  const used = new Set(real.filter(o => validCI(o.colorIndex)).map(o => o.colorIndex));
  let prev = null;
  real.forEach(o => {
    if (!validCI(o.colorIndex)) {
      const cand = [];
      for (let i = 0; cand.length < PALETTE.length; i++) if (!used.has(i)) cand.push(i);
      const pick = cand.find(i => !prev || !similarCol(PALETTE[i % PALETTE.length], prev));
      o.colorIndex = pick !== undefined ? pick : cand[0];
      used.add(o.colorIndex);
    }
    prev = PALETTE[o.colorIndex % PALETTE.length];
  });
}

/* ---------- date helpers (ISO strings only; no local-time parsing) ---------- */
const pad2 = n => String(n).padStart(2, '0');
function parseISO(s) {
  if (typeof s !== 'string') return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  const t = Date.UTC(y, mo - 1, d);
  const dt = new Date(t);
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
  return { y, mo, d, t };

function dayNum(s) { const p = parseISO(s); return p ? Math.round(p.t / DAY) : null; }
function isoFromDayNum(n) { const dt = new Date(n * DAY); return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`; }
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function fmtDate(s) { const p = parseISO(s); return p ? `${p.d} ${MON[p.mo - 1]} ${p.y}` : '—'; }
function fmtShort(s) { const p = parseISO(s); return p ? `${p.d} ${MON[p.mo - 1]}` : '—'; }
function rangeText(a, b) {
  const p = parseISO(a), q = parseISO(b);
  if (!p || !q) return '—';
  return p.y === q.y ? `${fmtShort(a)} – ${fmtShort(b)} ${q.y}` : `${fmtDate(a)} – ${fmtDate(b)}`;
}
function fmtStamp(date) { return `${pad2(date.getHours())}:${pad2(date.getMinutes())}`; }
function fmtDateTime(iso) {
  if (!iso) return 'never';
  const d = new Date(iso);
  if (isNaN(d)) return 'never';
  return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

/* ---------- misc helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp01 = v => { v = Number(v); return isFinite(v) ? Math.max(0, Math.min(100, v)) : 0; };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
function pct(p) { if (p >= 100) return 100; let r = Math.round(p); if (r >= 100) r = 99; if (p > 0 && r === 0) r = 1; return r; }
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

/* ---------- data model ---------- */
function blankProject() {
  const now = new Date().toISOString();
  return {
    schemaVersion: SCHEMA_VERSION,
    app: APP_ID,
    project: { id: 'PRJ-001', name: '', description: '', manager: '', startDate: '2026-10-01', endDate: '2027-06-30' },
    counters: { objective: 0, task: 0, subtask: 0, risk: 0, dependency: 0, milestone: 0 },
    objectives: [], risks: [], dependencies: [], milestones: [],
    meta: { createdAt: now, modifiedAt: now, lastExportedAt: null }
  };
}
let data = blankProject();
let D = null;     // derived values (progress, status, totals) — recalculated from `data` on every change
let IDX = null;   // id lookup indexes
const SYS_ID = 'OBJ-000';   // hidden bucket for tasks that are not linked to an objective yet
const realObjs = () => data.objectives.filter(o => !o.system);
function ensureUnassigned() {
  let o = data.objectives.find(x => x.system);
  if (!o) {
    o = { id: SYS_ID, system: true, name: 'Unassigned tasks', description: 'Tasks not yet linked to an objective', owner: '', priority: 'Medium', startDate: data.project.startDate, endDate: data.project.endDate, forecastStart: '', forecastEnd: '', status: 'auto', progress: 0, blocked: false, blocker: '', notes: [], tasks: [] };
    data.objectives.unshift(o);
  }
  return o;
}

function allIds(d = data) {
  const s = new Set();
  d.objectives.forEach(o => { s.add(o.id); o.tasks.forEach(t => { s.add(t.id); t.subtasks.forEach(x => s.add(x.id)); }); });
  d.risks.forEach(x => s.add(x.id)); d.dependencies.forEach(x => s.add(x.id)); d.milestones.forEach(x => s.add(x.id));
  return s;
}
function nextId(kind) {
  const used = allIds();
  let n = data.counters[kind] || 0, id;
  do { n++; id = `${PREFIX[kind]}-${String(n).padStart(3, '0')}`; } while (used.has(id));
  data.counters[kind] = n;
  return id;
}

/* Keep stored status/progress fields internally consistent. */
function syncLeaf(x) {
  x.progress = Math.round(clamp01(x.progress));
  if (x.status === 'completed') x.progress = 100;
  if (x.progress >= 100) { x.progress = 100; x.status = 'completed'; }
  else if (x.status === 'completed' || x.status === 'auto' || !LEAF_STATUSES.includes(x.status)) x.status = x.progress > 0 ? 'in-progress' : 'not-started';
  else if (x.status === 'not-started' && x.progress > 0) x.status = 'in-progress';
}
function syncStored(d = data) {
  assignColours(d);
  d.objectives.forEach(o => {
    o.tasks.forEach(t => {
      t.subtasks.forEach(syncLeaf);
      if (t.subtasks.length) { if (!FLAG_STATUSES.includes(t.status)) t.status = 'auto'; }
      else syncLeaf(t);
    });
    if (!FLAG_STATUSES.includes(o.status)) o.status = 'auto';
  });
}

/* =====================================================================
   Validation / normalisation of imported JSON
   ===================================================================== */
function parseProject(raw) {
  const errors = [], warnings = [];
  const E = m => errors.push(m), W = m => warnings.push(m);
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) { E('The file does not contain a JSON object.'); return { errors, warnings }; }
  if (typeof raw.schemaVersion !== 'number' || !isFinite(raw.schemaVersion)) E('Missing or invalid "schemaVersion" (expected a number).');
  else if (raw.schemaVersion > SCHEMA_VERSION) E(`The file uses schema version ${raw.schemaVersion}, which is newer than this application supports (${SCHEMA_VERSION}). Please use a newer version of the application.`);
  else if (raw.schemaVersion < 1) E('Invalid "schemaVersion" (must be 1 or greater).');

  if (!Array.isArray(raw.objectives)) E('"objectives" must be an array.');
  ['risks', 'dependencies', 'milestones'].forEach(k => { if (raw[k] !== undefined && !Array.isArray(raw[k])) E(`"${k}" must be an array.`); });
  if (errors.length) return { errors, warnings };

  const out = blankProject();
  const str = (v, def = '') => typeof v === 'string' ? v : (v == null ? def : String(v));
  const chkDate = (v, label, required) => {
    if (v == null || v === '') { if (required) E(`${label}: a date is required.`); return ''; }
    if (!parseISO(v)) { E(`${label}: "${v}" is not a valid ISO date (YYYY-MM-DD).`); return ''; }
    return v;
  };
  const chkRange = (s, e, label) => { if (s && e && dayNum(e) < dayNum(s)) E(`${label}: end date ${e} is before start date ${s}.`); };
  const chkEnum = (v, list, def, label) => { if (list.includes(v)) return v; if (v != null && v !== '') W(`${label}: unknown value "${v}", using "${def}".`); return def; };
  const chkProg = (v, label) => {
    if (v == null || v === '') return 0;
    const n = Number(v);
    if (!isFinite(n)) { W(`${label}: invalid progress "${v}", set to 0.`); return 0; }
    if (n < 0 || n > 100) W(`${label}: progress ${n} is outside 0–100 and was clamped.`);
    return clamp01(n);
  };
  const linksOf = (v, label) => {
    if (v == null) return [];
    if (!Array.isArray(v)) { W(`${label}: "links" should be an array, ignored.`); return []; }

    v.forEach(l => {
      if (!l || typeof l !== 'object' || typeof l.url !== 'string' || !l.url.trim()) { W(`${label}: a link without a web address was skipped.`); return; }

      if (!url) { W(`${label}: a link with a disallowed address type was skipped.`); return; }
      out.push({ name: typeof l.name === 'string' ? l.name.trim() : '', url });
    });
    return out;
  };
  const notesOf = (v, label) => {
    if (v == null) return [];

    const startDate = chkDate(s.startDate, `${label} start date`, true);
    const endDate = chkDate(s.endDate, `${label} end date`, true);

    (Array.isArray(o.tasks) ? o.tasks : []).forEach((t, j) => {

      if (t && t.subtasks !== undefined && !Array.isArray(t.subtasks)) E(`${tl}: "subtasks" must be an array.`);
      const hasSubs = !!(t && Array.isArray(t.subtasks) && t.subtasks.length);
      const tb = common(t, tl, hasSubs);

    if (!r || typeof r !== 'object') { E(`${lab}: must be an object.`); return; }

    if (!description) E(`${lab}: description is required.`);
    const num = (v, l) => { const n = Math.round(Number(v)); if (!isFinite(n) || n < 1 || n > 5) { W(`${lab}: ${l} should be 1–5, using 3.`); return 3; } return n; };

  });

    const name = str(m.name).trim();

  // meta + counters
  const meta = raw.meta && typeof raw.meta === 'object' ? raw.meta : {};

  Object.keys(PREFIX).forEach(k => {
    let max = Number(raw.counters && raw.counters[k]) || 0;
    allIds(out).forEach(id => { const m = new RegExp('^' + PREFIX[k] + '-(\\d+)$').exec(id); if (m) max = Math.max(max, +m[1]); });

/* ---------- modal + confirm (native <dialog>) ---------- */
function closeModal() { const d = $('#modal'); if (d.open) d.close(); d.innerHTML = ''; }
function openModal({ title, html, saveLabel = 'Save', onSave, wide = false, hideSave = false, danger = false, cancelLabel = 'Cancel', onOpen }) {
  const dlg = $('#modal');
  dlg.innerHTML = `<form class="modal-card ${wide ? 'wide' : ''}" novalidate>
    <header><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-modal-close aria-label="Close">${icon('x')}</button></header>
    <div class="modal-body">${html}</div>
    <div class="form-error modal-err" id="formError" role="alert" hidden></div>
    <footer><button type="button" class="btn ghost" data-modal-close>${esc(cancelLabel)}</button>${hideSave ? '' : `<button type="button" data-modal-save class="btn ${danger ? 'danger' : 'primary'}">${esc(saveLabel)}</button>`}</footer></form>`;
  const form = $('form', dlg);
  // Saving is driven by button clicks / Enter, NOT by native form submission (which is blocked when the
  // page runs inside a sandboxed viewer without "allow-forms").
  const doSave = () => {
    if (!onSave) { closeModal(); return; }
    const r = onSave(form);
    $$('.invalid', form).forEach(x => x.classList.remove('invalid'));
    if (r && r.error) {
      const fe = $('#formError', dlg); fe.textContent = r.error; fe.hidden = false;
      const bad = r.field && form.elements[r.field];
      if (bad) { bad.classList.add('invalid'); bad.scrollIntoView({ block: 'center' }); try { bad.focus(); } catch (e) { /* ignore */ } }
      return;
    }
    closeModal();
  };
  form.addEventListener('submit', e => { e.preventDefault(); doSave(); });
  form.addEventListener('click', e => { if (e.target.closest('[data-modal-save]')) { e.preventDefault(); doSave(); } });
  form.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'file' && e.target.type !== 'checkbox' && !e.isComposing) { e.preventDefault(); doSave(); } });
  if (!dlg.open) { try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); } }
  // when the start date changes, the end date follows it unless the user already moved it later
  const sd = form.elements.startDate, ed = form.elements.endDate;
  if (sd && ed && sd.type === 'date') {
    let prev = sd.value;
    sd.addEventListener('change', () => { if (!ed.value || ed.value === prev || (sd.value && dayNum(ed.value) < dayNum(sd.value))) ed.value = sd.value; prev = sd.value; });
  }
  if (onOpen) onOpen(form);
  const first = $('input:not([type=hidden]):not([disabled]),select,textarea', form);
  if (first && !('ontouchstart' in window)) first.focus();
  return form;
}
function confirmDialog({ title = 'Are you sure?', message = '', html = '', okLabel = 'Confirm', danger = false }) {
  return new Promise(res => {

    d.innerHTML = `<div class="modal-card small"><header><h3>${esc(title)}</h3></header>
      <div class="modal-body"><p class="confirm-msg">${message}</p>${html}</div>
      <footer><button type="button" data-confirm="cancel" value="cancel" class="btn ghost">Cancel</button><button type="button" data-confirm="ok" value="ok" class="btn ${danger ? 'danger' : 'primary'}" autofocus>${esc(okLabel)}</button></footer></div>`;
    d.returnValue = '';

}

/* ---------- tooltip ---------- */
function initTooltip() {
  const tip = $('#tip');
  const place = e => {
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 14, y = e.clientY + 16;
    if (x + w > window.innerWidth - 8) x = Math.max(8, e.clientX - w - 14);
    if (y + h > window.innerHeight - 8) y = Math.max(8, e.clientY - h - 14);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  };
  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) { tip.hidden = true; return; }
    tip.textContent = el.dataset.tip; tip.hidden = false; place(e);
  });
  document.addEventListener('mousemove', e => { if (!tip.hidden) place(e); });
  document.addEventListener('mouseleave', () => { tip.hidden = true; });
  document.addEventListener('scroll', () => { tip.hidden = true; }, true);
}

  const item = rec ? rec.item : null;

  const hasSubs = isTask && item && item.subtasks.length > 0;
  const v = item || { name: '', description: '', owner: parent.owner || '', priority: parent.priority || 'Medium', startDate: todayISO(), endDate: todayISO(), forecastStart: '', forecastEnd: '', status: 'not-started', progress: 0, blocked: false, blocker: '', notes: [] };

  const statusOpts = hasSubs
    ? [['auto', 'Automatic (from subtasks)'], ['at-risk', 'Flag as At risk'], ['on-hold', 'Put On hold']]
    : LEAF_STATUSES.map(s => [s, STATUS_LABEL[s]]);

  const progressBlock = hasSubs

    : `<div class="fld"><span class="fl">Progress (%)</span><div class="prog-ed"><input type="number" name="progress" min="0" max="100" step="1" value="${v.progress}">
        <span class="quick">${[0, 25, 50, 75, 100].map(n => `<button type="button" class="chip-btn" data-action="set-prog" data-v="${n}">${n}%</button>`).join('')}</span></div></div>`;
  const html = `<div class="fgrid">
    ${item ? `<div class="full calc-box">${idChip(item.id)} ${pill(info.status)} <b>${pct(info.progress)}%</b> <span class="muted">${isTask ? 'Part of ' + esc(rec.obj.name) : 'Subtask of ' + esc(rec.task.name)}</span></div>` : ''}
    ${fld(isTask ? 'Objective' : 'Parent task *', parentSel, 'full', isTask ? 'Optional — you can leave a task unassigned and link it to an objective later.' : '')}
    ${fld(`${isTask ? 'Task' : 'Subtask'} name *`, inp('name', v.name, 'required maxlength="160"'), 'full')}
    ${fld('Description', txt('description', v.description, 2), 'full')}
    ${fld('Owner', inp('owner', v.owner, 'list="owners" placeholder="Name"') + ownerDatalist())}
    ${fld('Priority', sel('priority', PRIORITIES, v.priority))}
    ${fld('Start date *', dateInp('startDate', v.startDate, 'required'))}
    ${fld('End date *', dateInp('endDate', v.endDate, 'required'))}
    ${forecastFields(v)}
    ${fld('Status', sel('status', statusOpts, stVal))}
    ${progressBlock}
    ${blockerFields(v)}
    ${depEditorHtml(item ? item.id : '')}
    ${isTask ? fld('Quick-add subtasks', txt('quickSubs', '', 3, 'placeholder="One subtask per line…"'), 'full', 'Each line becomes a subtask with this task\'s owner and dates. Tasks with subtasks calculate progress automatically.') : ''}
    ${linksEditorHtml(v.links)}
    ${notesBlock(v.notes)}
    <div class="full warn-note" id="dateWarn" hidden></div>
  </div>`;
  openModal({
    title: item ? `Edit ${isTask ? 'task' : 'subtask'} · ${item.id}` : `New ${isTask ? 'task' : 'subtask'}`, html, wide: true, saveLabel: item ? 'Save changes' : `Create ${isTask ? 'task' : 'subtask'}`,
    onOpen: f => {
      const checkWarn = () => {
        const pid = f.elements.parent.value; if (!pid) { const el0 = $('#dateWarn', f); el0.hidden = true; return; }
        const par = isTask ? IDX.objective.get(pid) : IDX.task.get(pid);
        const w = par ? dateWarning(val(f, 'startDate'), val(f, 'endDate'), par.item.startDate, par.item.endDate, isTask ? 'objective' : 'parent task') : '';
        const el = $('#dateWarn', f); el.textContent = w; el.hidden = !w;
      };
      f.addEventListener('input', e => { if (['startDate', 'endDate', 'parent'].includes(e.target.name)) checkWarn(); });
      // keep status and progress consistent while editing
      const st = f.elements.status, pr = f.elements.progress;
      if (pr && st) {
        st.addEventListener('change', () => { if (st.value === 'completed') pr.value = 100; else if (Number(pr.value) >= 100) pr.value = 90; });
        pr.addEventListener('input', () => { const n = Number(pr.value); if (n >= 100) st.value = 'completed'; else if (st.value === 'completed') st.value = n > 0 ? 'in-progress' : 'not-started'; else if (n > 0 && st.value === 'not-started') st.value = 'in-progress'; });
      }
      checkWarn();
    },
    onSave: f => {
      const name = val(f, 'name');
      if (!name) return { error: `Please enter a ${isTask ? 'task' : 'subtask'} name.`, field: 'name' };
      const de = dateErr(val(f, 'startDate'), val(f, 'endDate'), val(f, 'forecastStart'), val(f, 'forecastEnd'));
      if (de) return { error: de, field: 'startDate' };
      const newParent = val(f, 'parent'); if (!isTask && !newParent) return { error: 'Please choose a parent task.', field: 'parent' };
      const deps = collectDeps(f); if (deps.error) return { error: deps.error };
      const lks = collectLinks(f); if (lks.error) return { error: lks.error };
      const quick = isTask ? val(f, 'quickSubs').split(/\r?\n/).map(s => s.trim()).filter(Boolean) : [];
      const rec2 = item || (isTask ? { id: nextId('task'), subtasks: [], notes: [] } : { id: nextId('subtask'), notes: [] });
      const common = { links: lks.list, name, description: val(f, 'description'), owner: val(f, 'owner'), priority: val(f, 'priority'), startDate: val(f, 'startDate'), endDate: val(f, 'endDate'), forecastStart: val(f, 'forecastStart'), forecastEnd: val(f, 'forecastEnd'), blocked: val(f, 'blocked'), blocker: val(f, 'blocker') };
      Object.assign(rec2, common);
      const willHaveSubs = isTask && (rec2.subtasks.length + quick.length) > 0;
      const stSel = val(f, 'status');
      if (willHaveSubs) { rec2.status = FLAG_STATUSES.includes(stSel) ? stSel : 'auto'; }
      else {
        rec2.status = stSel === 'auto' ? 'not-started' : stSel;
        const pv = f.elements.progress ? Number(f.elements.progress.value) : rec2.progress;
        rec2.progress = isFinite(pv) ? Math.max(0, Math.min(100, Math.round(pv))) : 0;
        if (rec2.status === 'completed') rec2.progress = 100;
      }
      pushNote(rec2, val(f, 'newNote'));
      // attach to (possibly new) parent
      if (isTask) {
        const target = newParent ? IDX.objective.get(newParent).item : ensureUnassigned();
        if (item && rec.obj.id !== target.id) { rec.obj.tasks = rec.obj.tasks.filter(x => x.id !== item.id); }
        if (!item || rec.obj.id !== target.id) target.tasks.push(rec2);
        quick.forEach(line => target.tasks.find(t => t.id === rec2.id).subtasks.push({
          id: nextId('subtask'), name: line, description: '', owner: rec2.owner, priority: rec2.priority, startDate: rec2.startDate, endDate: rec2.endDate,
          forecastStart: '', forecastEnd: '', status: 'not-started', progress: 0, blocked: false, blocker: '', notes: []
        }));
      } else {
        const target = IDX.task.get(newParent).item;
        if (item && rec.task.id !== newParent) { rec.task.subtasks = rec.task.subtasks.filter(x => x.id !== item.id); }
        if (!item || rec.task.id !== newParent) target.subtasks.push(rec2);
      }
      applyDeps(rec2.id, deps.list);
      afterChange(); toast(item ? 'Changes saved' : `${isTask ? 'Task' : 'Subtask'} created`);
      if (isTask && quick.length) ui.collapsed.delete(rec2.id);
    }
  });
}

/* =====================================================================
   Add several tasks at once: pasted list (one per line) and/or CSV file
   ===================================================================== */
function parseCSV(text) {
  text = String(text).replace(/^﻿/, '');
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const count = ch => (first.match(new RegExp('\\' + ch, 'g')) || []).length;
  const delim = count(';') > count(',') && count(';') > count('\t') ? ';' : (count('\t') > count(',') ? '\t' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some(x => x.trim())) rows.push(row); row = []; }
    else cell += c;
  }
  row.push(cell); if (row.some(x => x.trim())) rows.push(row);
  return rows;
}
function looseDate(s) {
  s = (s || '').trim();
  if (parseISO(s)) return s;
  const m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(s);   // day/month/year (Irish / UK style)
  if (m) { const iso = `${m[3]}-${pad2(+m[2])}-${pad2(+m[1])}`; if (parseISO(iso)) return iso; }
  return '';
}
function findObjective(txt) {
  txt = (txt || '').trim().toLowerCase(); if (!txt) return null;
  return realObjs().find(o => o.id.toLowerCase() === txt || o.name.trim().toLowerCase() === txt) || null;
}
/* CSV rows -> [{name, owner, start, end, priority, objective, level}] ; header row is optional */
function csvToTaskRows(rows) {
  if (!rows.length) return { items: [], header: false };
  const norm = s => s.trim().toLowerCase().replace(/[^a-z]/g, '');
  const h = rows[0].map(norm);
  const idx = names => h.findIndex(x => names.includes(x));
  const nameCol = idx(['task', 'name', 'taskname', 'title', 'tasks']);
  const header = nameCol >= 0;
  const col = header ? { name: nameCol, owner: idx(['owner', 'assignee', 'assignedto']), start: idx(['start', 'startdate']), end: idx(['end', 'enddate', 'due', 'duedate', 'targetdate']), prio: idx(['priority']), obj: idx(['objective']) } : { name: 0, owner: -1, start: -1, end: -1, prio: -1, obj: -1 };
  const get = (r, c) => c >= 0 && r[c] !== undefined ? r[c].trim() : '';
  const items = rows.slice(header ? 1 : 0).map(r => ({ name: get(r, col.name), owner: get(r, col.owner), start: looseDate(get(r, col.start)), end: looseDate(get(r, col.end)), priority: PRIORITIES.find(p => p.toLowerCase() === get(r, col.prio).toLowerCase()) || '', objective: get(r, col.obj), level: 0 })).filter(x => x.name);
  return { items, header, extra: header && (col.owner >= 0 || col.start >= 0 || col.end >= 0 || col.prio >= 0 || col.obj >= 0) };
}
/* pasted text -> rows. Indented / "-" lines become subtasks of the line above. */
function textToTaskRows(text) {
  const out = [];
  String(text).split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const sub = /^(\s{2,}|\t|[-•*–]\s+)/.test(line) && out.some(x => x.level === 0);
    let name = line.replace(/^(\s+|[-•*–]\s+)+/, '').split('\t')[0].replace(/^"|"$/g, '').trim();
    if (name) out.push({ name, owner: '', start: '', end: '', priority: '', objective: '', level: sub ? 1 : 0 });
  });
  return out;
}

          preview();

    },

      if (!rows.length) return { error: 'Enter at least one task name or choose a CSV file.', field: 'names' };
      if (rows.length > 1000) return { error: 'That is a lot — please import at most 1,000 rows at a time.' };
      const dS = val(f, 'startDate'), dE = val(f, 'endDate');

      const dOwner = val(f, 'owner'), dPrio = val(f, 'priority'), pid = val(f, 'parent');
      const defObj = pid ? IDX.objective.get(pid).item : null;
      let nT = 0, nS = 0, nUn = 0, lastTask = null, missingObj = 0;
      rows.forEach(r => {
        if (r.level === 1 && lastTask) {

          nS++; return;
        }
        let target = defObj;

        const tgt = target || ensureUnassigned();
        let s = r.start || dS, e = r.end || dE;
        if (dayNum(e) < dayNum(s)) { s = dS; e = dE; }
        const t = { id: nextId('task'), name: r.name, description: '', owner: r.owner || dOwner, priority: r.priority || dPrio, startDate: s, endDate: e, forecastStart: '', forecastEnd: '', status: 'not-started', progress: 0, blocked: false, blocker: '', notes: [], subtasks: [] };
        tgt.tasks.push(t); lastTask = t; nT++; if (tgt.system) nUn++;
      });
      afterChange();
      toast(`Created ${nT} task${nT === 1 ? '' : 's'}${nS ? ` and ${nS} subtask${nS === 1 ? '' : 's'}` : ''}${nUn ? ` (${nUn} unassigned)` : ''}.${missingObj ? ` ${missingObj} row(s) named an objective that wasn't found.` : ''}`, missingObj ? 'warn' : 'ok', missingObj ? 6000 : 3500);
    }
  });
}

/* ---------------- Tasks & subtasks ---------------- */
function ownerCell(n) { return avatar(n); }
function taskRowHtml(kind, item, parentLabel) {
  const info = D.node.get(item.id), isSub = kind === 'sub';

  const deps = D.depsFrom.get(item.id) || [];
  const chips = [];
  if (info.blocked || info.ownBlocked) chips.push(`<span class="chip red" data-tip="${esc(item.blocker || 'Blocked')}">${icon('ban', 12)} Blocked</span>`);
  if (info.overdue) chips.push('<span class="chip amber">Overdue</span>');
  if (deps.length) chips.push(`<span class="chip" data-tip="${esc(deps.map(d => '• ' + depTargetName(d)).join('\n'))}">${icon('link', 12)} ${deps.length}</span>`);
  if (info.ownBlocked && item.blocker) chips.push(`<span class="blocker-txt">${esc(item.blocker)}</span>`);
  const prog = info.leaf
    ? `<div class="prog-ctl"><input type="range" min="0" max="100" step="5" value="${pct(info.progress)}" data-progress data-id="${esc(item.id)}" aria-label="Progress for ${esc(item.name)}" class="st-${info.status}"><span class="ptxt">${pct(info.progress)}%</span></div>`

  const tc = objCol((isSub ? IDX.sub : IDX.task).get(item.id).obj);

    <div class="t-name" data-label="">${hasSubs ? `<button class="chev ${collapsed ? '' : 'open'}" data-action="toggle" data-id="${esc(item.id)}" aria-label="${collapsed ? 'Expand' : 'Collapse'} subtasks">${icon('chevron', 15)}</button>` : '<span class="chev-sp"></span>'}
      <div class="t-name-txt"><button class="link-btn" data-action="${isSub ? 'sub-view' : 'task-view'}" data-id="${esc(item.id)}" data-tip="Open (read only)">${esc(item.name)}</button>
      <div class="sub">${idChip(item.id)}${hasSubs ? `<span class="muted small">${info.subDone}/${info.subCount} subtasks</span>` : ''}${chips.join('')}${linkChips(item)}</div></div></div>

    <div class="t-dates" data-label="Dates"><span>${esc(rangeText(item.startDate, item.endDate))}</span>${forecastText(item) ? `<br>${forecastText(item)}` : ''}</div>
    <div class="t-prio" data-label="Priority">${prioChip(item.priority)}</div>
    <div class="t-stat" data-label="Status">${pill(info.status)}</div>
    <div class="t-prog" data-label="Progress">${prog}</div>
    <div class="t-act">${isSub ? '' : `<button class="icon-btn" data-action="sub-new" data-task="${esc(item.id)}" data-tip="Add subtask" aria-label="Add subtask">${icon('plus', 16)}</button>`}
      <button class="icon-btn" data-action="${isSub ? 'sub-view' : 'task-view'}" data-id="${esc(item.id)}" data-tip="View (read only)" aria-label="View (read only)">${icon('book', 16)}</button>

function depTargetName(d) {
  if (d.toId) return `${d.type === 'objective' ? 'Objective' : 'Task'}: ${nameOf(d.toId)}`;
